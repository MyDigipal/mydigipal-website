<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morphing de formes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block" rel="stylesheet">
<style>
/* Une seule forme qui voyage sur un rail et se transforme : bulle, engrenage, coche. */
:root{--encre:#161a22;--creme:#fbf8f1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#e8ecf3;font-family:'Bricolage Grotesque',sans-serif;color:var(--encre);-webkit-font-smoothing:antialiased}
#scene{position:absolute;inset:0}
#titre{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:44px;font-weight:500;letter-spacing:-.01em;line-height:1.2;overflow:hidden;padding:.05em 0 .22em;color:rgba(22,26,34,.72)}
.lab{position:absolute;top:800px;width:520px;margin-left:-260px;text-align:center;overflow:hidden;font-size:56px;font-weight:600;letter-spacing:-.015em;line-height:1.2;padding:.05em 0 .22em}
.ln{display:inline-block;transform:translateY(125%)}
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
      <filter id="flou" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
    </defs>
    <line id="rail" x1="400" y1="540" x2="1520" y2="540" stroke="rgba(22,26,34,.22)" stroke-width="3" stroke-linecap="round"/>
    <g id="marques" fill="rgba(22,26,34,.3)">
      <circle cx="400" cy="540" r="9"/><circle cx="960" cy="540" r="9"/><circle cx="1520" cy="540" r="9"/>
    </g>
    <ellipse id="ombre" cx="400" cy="745" rx="170" ry="30" fill="rgba(22,26,34,.28)" filter="url(#flou)"/>
    <g id="noeud" transform="translate(400 540) scale(0)">
      <circle id="disque" r="215" fill="#2b4be3"/>
      <g id="forme">
        <path id="trace" fill="#fbf8f1" d=""/>
        <circle id="trou" r="0" fill="#2b4be3"/>
      </g>
    </g>
  </svg>
  <div id="titre"><span class="ln" id="titreLn">Ce que vous construisez, de la question au résultat</span></div>
  <div class="lab" style="left:400px"><span class="ln" id="lab0">Prompt</span></div>
  <div class="lab" style="left:960px"><span class="ln" id="lab1">Automatisation</span></div>
  <div class="lab" style="left:1520px"><span class="ln" id="lab2">Résultat</span></div>
</div>

<script>
window.STAGE = { w: 1920, h: 1080 };
window.DUREE = 8;
window.PRET = document.fonts.load("600 56px 'Bricolage Grotesque'").then(function () { return document.fonts.ready; });

/* ---------- outils de temps (purs) ---------- */
var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
var seg = function (t, a, b) { return clamp((t - a) / (b - a), 0, 1); };
var mix = function (a, b, p) { return a + (b - a) * p; };
var outExpo = function (p) { return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); };
var inOutQuart = function (p) { return p < 0.5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2; };
var inOutCubic = function (p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
var inOutSine = function (p) { return -(Math.cos(Math.PI * p) - 1) / 2; };
var outBack = function (s) { return function (p) { return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); }; };
var inBack = function (s) { return function (p) { return (s + 1) * p * p * p - s * p * p; }; };
/* rebond amorti : 0 au départ, oscille, revient à 0 (pas de saut à l'arrivée ni à la fin) */
var rebond = function (p) { return p <= 0 || p >= 1 ? 0 : Math.sin(p * Math.PI * 3) * Math.pow(1 - p, 2); };

var hex = function (h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; };
var mixC = function (a, b, p) { return a.map(function (v, i) { return mix(v, b[i], p); }); };
var css = function (c) { return 'rgb(' + c.map(function (v) { return Math.round(v); }).join(',') + ')'; };
var FOND = [hex('#e8ecf3'), hex('#f5efe3'), hex('#e6f1ea')];
var DISQUE = [hex('#2b4be3'), hex('#ef6a2c'), hex('#1c9c66')];

/* ---------- géométrie : trois contours fermés, ré-échantillonnés à N points ---------- */
var N = 360;
var pt = function (x, y) { return { x: x, y: y }; };
var sub = function (a, b) { return pt(a.x - b.x, a.y - b.y); };
var add = function (a, b) { return pt(a.x + b.x, a.y + b.y); };
var mul = function (a, k) { return pt(a.x * k, a.y * k); };
var dist = function (a, b) { return Math.hypot(a.x - b.x, a.y - b.y); };
var norm = function (a) { var l = Math.hypot(a.x, a.y) || 1; return pt(a.x / l, a.y / l); };
var polaire = function (r, deg) { var a = deg * Math.PI / 180; return pt(r * Math.cos(a), r * Math.sin(a)); };

/* Remplace chaque sommet par un congé de rayon r (nombre ou tableau), échantillonné en n points. */
function arrondir(pts, rayons, n) {
  var out = [], m = pts.length;
  for (var i = 0; i < m; i++) {
    var p0 = pts[(i - 1 + m) % m], p1 = pts[i], p2 = pts[(i + 1) % m];
    var v1 = norm(sub(p0, p1)), v2 = norm(sub(p2, p1));
    var ang = Math.acos(clamp(v1.x * v2.x + v1.y * v2.y, -1, 1));
    var r = typeof rayons === 'number' ? rayons : rayons[i];
    if (ang < 0.02 || ang > Math.PI - 0.02 || r <= 0) { out.push(p1); continue; }
    var tanH = Math.tan(ang / 2);
    var rr = Math.min(r, dist(p0, p1) / 2 * tanH, dist(p2, p1) / 2 * tanH);
    var d = rr / tanH;
    var a = add(p1, mul(v1, d)), b = add(p1, mul(v2, d));
    var c = add(p1, mul(norm(add(v1, v2)), rr / Math.sin(ang / 2)));
    var a0 = Math.atan2(a.y - c.y, a.x - c.x), a1 = Math.atan2(b.y - c.y, b.x - c.x);
    var da = a1 - a0;
    while (da > Math.PI) da -= 2 * Math.PI;
    while (da < -Math.PI) da += 2 * Math.PI;
    for (var k = 0; k <= n; k++) { var aa = a0 + da * k / n; out.push(pt(c.x + rr * Math.cos(aa), c.y + rr * Math.sin(aa))); }
  }
  return out;
}
/* Même sens de parcours pour tous les contours (aire signée positive). */
function orienter(pts) {
  var s = 0;
  for (var i = 0; i < pts.length; i++) { var q = pts[(i + 1) % pts.length]; s += pts[i].x * q.y - q.x * pts[i].y; }
  return s < 0 ? pts.slice().reverse() : pts;
}
/* N points à égale distance le long du contour fermé. */
function reechantillonner(pts, n) {
  var L = [0], tot = 0;
  for (var i = 0; i < pts.length; i++) { tot += dist(pts[i], pts[(i + 1) % pts.length]); L.push(tot); }
  var out = [], j = 0;
  for (var k = 0; k < n; k++) {
    var s = tot * k / n;
    while (j < pts.length - 1 && L[j + 1] < s) j++;
    var a = pts[j], b = pts[(j + 1) % pts.length], u = (s - L[j]) / ((L[j + 1] - L[j]) || 1);
    out.push(pt(mix(a.x, b.x, u), mix(a.y, b.y, u)));
  }
  return out;
}
/* Décale le point de départ de B pour qu'il tombe en face de celui de A (moindres carrés). */
function aligner(A, B) {
  var best = 0, bestD = Infinity;
  for (var k = 0; k < N; k++) {
    var d = 0;
    for (var i = 0; i < N; i += 3) { var b = B[(i + k) % N]; d += (A[i].x - b.x) * (A[i].x - b.x) + (A[i].y - b.y) * (A[i].y - b.y); }
    if (d < bestD) { bestD = d; best = k; }
  }
  return B.map(function (_, i) { return B[(i + best) % N]; });
}
function contour(pts, rayons) { return reechantillonner(orienter(arrondir(pts, rayons, 10)), N); }

function bulle() {
  var w = 320, h = 220, x0 = -w / 2, y0 = -h / 2 - 18;
  var pts = [pt(x0, y0), pt(x0 + w, y0), pt(x0 + w, y0 + h), pt(x0 + 124, y0 + h), pt(x0 + 44, y0 + h + 72), pt(x0 + 64, y0 + h), pt(x0, y0 + h)];
  return contour(pts, [66, 66, 66, 12, 9, 12, 66]);
}
function engrenage(dents, rIn, rOut) {
  var pts = [], pas = 360 / dents;
  for (var i = 0; i < dents; i++) {
    var a = i * pas;
    pts.push(polaire(rIn, a - 0.27 * pas), polaire(rOut, a - 0.15 * pas), polaire(rOut, a + 0.15 * pas), polaire(rIn, a + 0.27 * pas));
    for (var k = 1; k <= 3; k++) pts.push(polaire(rIn, a + 0.27 * pas + 0.46 * pas * k / 4));
  }
  return contour(pts, 11);
}
function coche() {
  var P0 = pt(-150, 8), P1 = pt(-52, 104), P2 = pt(168, -118), h = 34;
  var d1 = norm(sub(P1, P0)), d2 = norm(sub(P2, P1));
  var n1 = pt(-d1.y, d1.x), n2 = pt(-d2.y, d2.x);
  var m = mul(add(n1, n2), h / (1 + n1.x * n2.x + n1.y * n2.y));
  var pts = [sub(P0, mul(n1, h)), sub(P1, m), sub(P2, mul(n2, h)), add(P2, mul(n2, h)), add(P1, m), add(P0, mul(n1, h))];
  return contour(pts, [16, 22, 16, 16, 22, 16]);
}
var FA = bulle(), FB = aligner(FA, engrenage(8, 128, 168)), FC = aligner(FB, coche());

/* Interpolation point à point, avec une ondulation qui n'existe qu'au milieu du passage. */
function melange(A, B, p, amp) {
  var w = Math.sin(p * Math.PI), s = '';
  for (var i = 0; i < N; i++) {
    var x = mix(A[i].x, B[i].x, p), y = mix(A[i].y, B[i].y, p);
    if (amp > 0 && w > 0) {
      var ang = Math.atan2(y, x), r = Math.hypot(x, y) + amp * w * Math.sin(ang * 3 + p * 6.2832);
      x = r * Math.cos(ang); y = r * Math.sin(ang);
    }
    s += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return s + 'Z';
}

/* ---------- la partition (secondes) ---------- */
var X = [400, 960, 1520], L = X[2] - X[0];
var T = {
  noeud: [0.15, 0.8], noeudOut: [7.45, 7.95],
  rail: [0.2, 1.05], railOut: [7.15, 7.75],
  marques: [0.85, 1.35],
  titre: [0.5, 1.25], titreOut: [7.05, 7.5],
  voyage1: [1.6, 2.9], morph1: [1.7, 3.0], rebond1: [2.9, 3.6],
  voyage2: [4.25, 5.55], morph2: [4.35, 5.65], rebond2: [5.55, 6.25],
  rot: [1.6, 5.75],
  pop: [5.9, 6.5],
  lab: [0.95, 3.15, 5.75], labDur: 0.75, labOut: 7.25, labSx: 0.08, labDurOut: 0.42,
  fondRetour: [7.3, 8.0]
};
function positionX(t) {
  var p1 = inOutQuart(seg(t, T.voyage1[0], T.voyage1[1])), p2 = inOutQuart(seg(t, T.voyage2[0], T.voyage2[1]));
  return X[0] + (X[1] - X[0]) * p1 + (X[2] - X[1]) * p2;
}

var $ = function (id) { return document.getElementById(id); };
var stage = $('stage'), rail = $('rail'), marques = $('marques').children, ombre = $('ombre'), noeud = $('noeud'),
    disque = $('disque'), forme = $('forme'), trace = $('trace'), trou = $('trou'), titreLn = $('titreLn'),
    labs = [$('lab0'), $('lab1'), $('lab2')];
rail.setAttribute('stroke-dasharray', L + ' ' + L);

/* ---------- render(t) : pur, déterministe ---------- */
window.render = function (t) {
  var m1 = inOutCubic(seg(t, T.morph1[0], T.morph1[1])), m2 = inOutCubic(seg(t, T.morph2[0], T.morph2[1]));

  /* fond et couleur du disque glissent avec la transformation, puis reviennent au départ pour boucler */
  var fond = m2 > 0 ? mixC(FOND[1], FOND[2], m2) : mixC(FOND[0], FOND[1], m1);
  fond = mixC(fond, FOND[0], inOutSine(seg(t, T.fondRetour[0], T.fondRetour[1])));
  stage.style.background = css(fond);
  var coul = css(m2 > 0 ? mixC(DISQUE[1], DISQUE[2], m2) : mixC(DISQUE[0], DISQUE[1], m1));
  disque.setAttribute('fill', coul);
  trou.setAttribute('fill', coul);

  /* rail : se trace depuis la gauche, se retire par la gauche */
  var pr = outExpo(seg(t, T.rail[0], T.rail[1])), prx = inOutQuart(seg(t, T.railOut[0], T.railOut[1]));
  rail.setAttribute('stroke-dashoffset', (L * (1 - pr) - L * prx).toFixed(2));
  for (var i = 0; i < 3; i++) {
    var pm = outBack(1.7)(seg(t, T.marques[0] + i * 0.15, T.marques[1] + i * 0.15)) * (1 - prx);
    marques[i].setAttribute('transform', 'translate(' + X[i] + ' 540) scale(' + Math.max(0, pm).toFixed(4) + ') translate(' + (-X[i]) + ' -540)');
  }

  /* le noeud : position, échelle d'entrée et de sortie, étirement selon la vitesse, rebond à l'arrivée */
  var x = positionX(t);
  var v = (positionX(t + 0.016) - positionX(t - 0.016)) / 0.032;
  var etire = Math.min(0.32, Math.abs(v) / 5500);
  var base = Math.max(0, outBack(1.7)(seg(t, T.noeud[0], T.noeud[1])) * (1 - inBack(1.7)(seg(t, T.noeudOut[0], T.noeudOut[1]))));
  var reb = 0.13 * (rebond(seg(t, T.rebond1[0], T.rebond1[1])) + rebond(seg(t, T.rebond2[0], T.rebond2[1])));
  var sx = Math.max(0, base * (1 + etire - reb)), sy = Math.max(0, base * (1 / (1 + etire) + reb));
  noeud.setAttribute('transform', 'translate(' + x.toFixed(2) + ' 540) scale(' + sx.toFixed(4) + ' ' + sy.toFixed(4) + ')');
  ombre.setAttribute('cx', x.toFixed(2));
  ombre.setAttribute('rx', (170 * sx).toFixed(2));
  ombre.setAttribute('opacity', clamp(base, 0, 1).toFixed(3));

  /* la forme : bulle vers engrenage vers coche, rotation qui retombe droite sur la coche */
  var d = m2 > 0 ? melange(FB, FC, m2, 9) : melange(FA, FB, m1, 9);
  trace.setAttribute('d', d);
  var angle = 360 * inOutSine(seg(t, T.rot[0], T.rot[1]));
  var pop = seg(t, T.pop[0], T.pop[1]);
  var sf = 1 + 0.11 * Math.sin(pop * Math.PI) * (1 - pop) * 2;
  forme.setAttribute('transform', 'rotate(' + angle.toFixed(2) + ') scale(' + sf.toFixed(4) + ')');
  var engr = m1 * (1 - m2);
  trou.setAttribute('r', (48 * outBack(1.5)(clamp((engr - 0.55) / 0.45, 0, 1)) * (m2 > 0 ? 1 - m2 : 1)).toFixed(2));

  /* titre et étiquettes : chacune monte à sa place, jamais de remplacement sur place */
  var pti = outBack(1.3)(seg(t, T.titre[0], T.titre[1])), ptx = inBack(1.2)(seg(t, T.titreOut[0], T.titreOut[1]));
  titreLn.style.transform = 'translateY(' + (ptx > 0 ? mix(0, 135, ptx) : mix(125, 0, pti)).toFixed(2) + '%)';
  for (var j = 0; j < 3; j++) {
    var pe = outBack(1.4)(seg(t, T.lab[j], T.lab[j] + T.labDur));
    var px = inBack(1.2)(seg(t, T.labOut + j * T.labSx, T.labOut + j * T.labSx + T.labDurOut));
    labs[j].style.transform = 'translateY(' + (px > 0 ? mix(0, 135, px) : mix(125, 0, pe)).toFixed(2) + '%)';
  }
};
</script>
<script src="../lecteur.js"></script>
</body>
</html>
