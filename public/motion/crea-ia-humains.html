<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'IA produit, nos créatifs décident</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
/* Page Creative design (demande de Paul du 20/10/2026) : « on utilise à fond l'IA, couplée à
   l'intelligence et à la créativité des humains ». Trois actes, sur la marque fictive Atelier Rivière :
   1. la charte du client entre dans trois outils : Claude écrit le message, Nano Banana crée
      l'image (elle se précise depuis le bruit), Higgsfield anime la vidéo ;
   2. ce que les outils ont produit vole dans la bannière, puis la direction artistique la relit
      point par point. Un point ne passe pas (le produit trop petit) : le repère se pose sur la lampe,
      relié au point de la liste, et la correction se fait sous nos yeux ;
   3. la bannière relue part dans le Hub du client, à côté de ses deux variantes.
   Les marques de Claude et de Google (Nano Banana) sont celles de simple-icons, en usage nominatif ;
   Higgsfield n'a pas de marque libre : son nom seul, avec une icône neutre. render(t) est pur. */
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#08131f;font-family:'Plus Jakarta Sans',sans-serif;color:#f4f7fa;-webkit-font-smoothing:antialiased}
#lueur{position:absolute;inset:0;background:radial-gradient(900px 700px at 85% -10%,rgba(29,113,184,.30),rgba(8,19,31,0) 65%),radial-gradient(700px 600px at 0% 110%,rgba(232,189,98,.08),rgba(8,19,31,0) 60%)}
.mask{overflow:hidden;padding:.06em 0 .2em;margin-bottom:-.14em}
.ln{display:block;transform:translateY(140%);white-space:nowrap}
#titre{position:absolute;left:72px;top:64px;z-index:9}
.titre-acte{position:absolute;left:0;top:0}
#titre .k .ln{font-size:30px;font-weight:700;color:#7DB8EE;letter-spacing:.01em;margin-bottom:12px}
#titre .t .ln{font-size:60px;font-weight:800;letter-spacing:-.035em;line-height:1.04}
#titre .t .ln .o{color:#e8bd62}
.abs{position:absolute;left:0;top:0}

/* La charte */
#kit{width:380px;height:580px;border-radius:28px;background:#0d2135;box-shadow:0 60px 120px -50px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.08);padding:28px 30px;box-sizing:border-box}
#kit h3{margin:0 0 18px;font-size:30px;font-weight:800;letter-spacing:-.02em}
#kit .r{font-family:Inter,sans-serif;font-size:20px;font-weight:600;color:#7DB8EE;margin:20px 0 10px}
#kit .marque{height:64px;border-radius:14px;background:#f1e9dc;color:#1d2a24;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;font-weight:600;letter-spacing:.2em;font-size:20px}
#kit .pastilles{display:flex;gap:14px}
#kit .pastilles i{width:52px;height:52px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
#kit .aa{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1}
#kit .photos{display:flex;gap:14px}
#kit .photos div{width:146px;height:104px;border-radius:12px;background:#f1e9dc;position:relative;overflow:hidden}
#fils{position:absolute;left:0;top:0;width:1080px;height:1080px;pointer-events:none;z-index:2}
#fils path{fill:none;stroke:rgba(125,184,238,.55);stroke-width:2.5;stroke-linecap:round}
#fils circle{fill:#e8bd62}

/* Les trois outils */
.outil{width:520px;height:170px;border-radius:26px;background:#0d2135;box-shadow:0 50px 100px -45px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,255,255,.08);z-index:3}
.outil .gl{position:absolute;left:26px;top:30px;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
.outil .gl svg{width:32px;height:32px;fill:#f4f7fa}
.outil .nom{position:absolute;left:106px;top:28px;font-size:32px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.outil .role{position:absolute;left:106px;top:74px;font-family:Inter,sans-serif;font-size:22px;font-weight:600;color:#a9b8c8;white-space:nowrap}
.outil .etat{position:absolute;left:106px;top:118px;font-family:Inter,sans-serif;font-size:19px;font-weight:600;color:#e8bd62;white-space:nowrap}
.tuile{position:absolute;right:16px;top:16px;width:138px;height:138px;border-radius:16px;background:#f1e9dc;overflow:hidden}
.tuile .tx{position:absolute;left:14px;top:30px;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.05;color:#1d2a24;white-space:nowrap}
.tuile .caret{display:inline-block;width:3px;height:22px;background:#1D71B8;vertical-align:-3px;margin-left:2px}
.tuile canvas{position:absolute;inset:0}
.tuile.v{left:auto;right:44px;width:82px;height:138px}
.tuile .pb{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(29,42,36,.15)}
.tuile .pb i{display:block;height:100%;background:#1D71B8;transform-origin:0 50%}

/* La bannière, assemblée */
#bn{width:460px;height:460px;border-radius:18px;background:#f1e9dc;overflow:hidden;box-shadow:0 60px 120px -50px rgba(0,0,0,.95);z-index:4}
#bn > *{position:absolute;left:0;top:0;transform-origin:0 0}
.halo{border-radius:50%;background:radial-gradient(closest-side,rgba(246,196,98,.75),rgba(246,196,98,.25) 55%,rgba(246,196,98,0))}
#bn .logo{font-family:Inter,sans-serif;font-weight:600;letter-spacing:.18em;color:#1d2a24;font-size:16px;white-space:nowrap}
#bn .sous{font-family:Inter,sans-serif;font-weight:600;color:#7a6a52;font-size:19px;white-space:nowrap}
.tl{font-weight:800;letter-spacing:-.035em;line-height:1.02;color:#1d2a24;white-space:nowrap;font-size:40px}
#bn .cta{font-family:Inter,sans-serif;font-weight:600;color:#f1e9dc;background:#1d2a24;border-radius:999px;font-size:18px;padding:10px 20px;line-height:1;white-space:nowrap}
#volTitre{z-index:6}
#volLampe{z-index:6;transform-origin:0 0}
#volVideo{z-index:6}

/* La relecture */
#relu{width:440px;z-index:3}
#relu .tete{display:flex;align-items:center;gap:18px;margin-bottom:26px}
#relu .av{width:74px;height:74px;border-radius:50%;background:linear-gradient(160deg,#7DB8EE,#1D71B8);display:grid;place-items:center}
#relu .av svg{width:40px;height:40px;fill:#08131f}
#relu .qui{font-size:30px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
#relu .quoi{font-family:Inter,sans-serif;font-size:21px;font-weight:600;color:#a9b8c8;white-space:nowrap}
.pt{position:relative;height:66px;margin-bottom:14px;border-radius:18px;background:#0d2135;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;gap:16px;padding:0 20px;font-size:25px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pt .c{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);position:relative}
.pt .c:after{content:'';position:absolute;left:10px;top:9px;width:12px;height:7px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg);opacity:var(--ok,0)}
.pt .c b{position:absolute;inset:0;border-radius:50%;background:#1D71B8;opacity:var(--ok,0);z-index:-0}
.pt .c.x b{background:#e8bd62}
#repere{width:46px;height:46px;border-radius:50%;background:#e8bd62;box-shadow:0 0 0 8px rgba(232,189,98,.25);z-index:7;display:grid;place-items:center;font-size:24px;font-weight:800;color:#08131f}
#filRep{position:absolute;left:0;top:0;width:1080px;height:1080px;pointer-events:none;z-index:6}
#filRep path{fill:none;stroke:#e8bd62;stroke-width:3;stroke-linecap:round;stroke-dasharray:1}
#tampon{z-index:8;font-family:Inter,sans-serif;font-size:21px;font-weight:600;padding:10px 18px;border-radius:999px;background:#1D71B8;color:#fff;white-space:nowrap}

/* Le Hub */
#hub{width:960px;height:600px;border-radius:28px;background:#f4f7fa;color:#0b1b2b;box-shadow:0 70px 140px -60px rgba(0,0,0,.95);z-index:2;overflow:hidden;font-family:Inter,sans-serif}
#hub .barre{height:56px;background:#e8eef4;display:flex;align-items:center;gap:10px;padding:0 22px;font-size:19px;font-weight:600;color:#5b6b7c}
#hub .barre i{width:12px;height:12px;border-radius:50%;background:#c9d4df}
#hub .barre span{margin-left:12px}
#hub .h1{position:absolute;left:40px;top:86px;font-family:'Plus Jakarta Sans';font-size:34px;font-weight:800;letter-spacing:-.02em;color:#0b1b2b;white-space:nowrap}
#hub .h2{position:absolute;left:40px;top:136px;font-size:21px;font-weight:600;color:#5b6b7c;white-space:nowrap}
#hub .round{position:absolute;right:40px;top:92px;padding:9px 18px;border-radius:999px;background:#e6f0fa;color:#1D71B8;font-size:20px;font-weight:600}
.var{position:absolute;top:196px;width:270px;height:270px;border-radius:16px;overflow:hidden}
.var .tl{font-size:24px}
.var .vl{position:absolute;left:0;top:282px;font-size:20px;font-weight:600;color:#5b6b7c;white-space:nowrap}
#toast{z-index:9;width:420px;padding:20px 24px;border-radius:20px;background:#0d2135;box-shadow:0 40px 80px -30px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.1);display:flex;gap:16px;align-items:center}
#toast .cl{flex:none;width:52px;height:52px;border-radius:50%;background:#1D71B8;display:grid;place-items:center}
#toast .cl svg{width:26px;height:26px;fill:#fff}
#toast b{display:block;font-size:24px;font-weight:800;letter-spacing:-.01em}
#toast span{font-family:Inter,sans-serif;font-size:19px;font-weight:600;color:#a9b8c8}
#prechargeur{position:absolute;left:-9999px;top:-9999px;visibility:hidden}

/* Version verticale 1080 x 1350 (?p=1), pour le téléphone : aucun texte de la scène sous 30 px.
   La charte devient un bandeau, les trois outils s'empilent dessous ; à la relecture, la liste passe
   à droite de la bannière ; le Hub et sa notification s'empilent. Le carré ne lit aucune de ces règles. */
#stage.p{height:1350px}
#stage.p #titre .k .ln{font-size:40px;margin-bottom:14px}
#stage.p #titre .t .ln{font-size:72px}
#stage.p #fils,#stage.p #filRep{height:1350px}
#stage.p #kit{width:1000px;height:310px;padding:0}
#stage.p #kit > *{position:absolute;margin:0}
#stage.p #kit h3{left:36px;top:30px;font-size:40px}
#stage.p #kit .marque{right:36px;top:24px;height:68px;padding:0 30px;font-size:30px;letter-spacing:.16em}
#stage.p #kit .r{font-size:30px;top:128px}
#stage.p #kit [data-txt=couleurs]{left:36px}
#stage.p #kit [data-txt=typo]{left:384px}
#stage.p #kit [data-txt=photos]{left:620px}
#stage.p #kit .pastilles{left:36px;top:180px}
#stage.p #kit .pastilles i{width:60px;height:60px}
#stage.p #kit .aa{left:384px;top:176px;font-size:80px}
#stage.p #kit .photos{left:620px;top:180px}
#stage.p .outil{width:900px;height:186px}
#stage.p .outil .gl{left:28px;top:34px;width:72px;height:72px}
#stage.p .outil .gl svg{width:36px;height:36px}
#stage.p .outil .nom{left:124px;top:22px;font-size:40px}
#stage.p .outil .role{left:124px;top:78px;font-size:32px}
#stage.p .outil .etat{left:124px;top:126px;font-size:30px}
#stage.p .outil .etat svg{width:22px;height:16px}
#stage.p .tuile{width:154px;height:154px}
#stage.p #o0 .tuile{width:250px}
#stage.p .tuile canvas{width:100%;height:100%}
#stage.p .tuile.v{right:50px;width:94px;height:154px}
#stage.p .tuile .tx{left:16px;top:36px}
#stage.p .tuile .caret{height:28px}
#stage.p #relu{width:1000px}
#stage.p #relu .tete{position:absolute;left:0;top:-203px;margin:0}
#stage.p #relu .av{width:84px;height:84px}
#stage.p #relu .av svg{width:46px;height:46px}
#stage.p #relu .qui{font-size:40px}
#stage.p #relu .quoi{font-size:30px}
#stage.p .pt{margin-left:540px;width:460px;box-sizing:border-box;height:78px;margin-bottom:14px;font-size:30px;gap:16px;padding:0 20px}
#stage.p .pt .c{width:40px;height:40px}
#stage.p .pt .c:after{left:12px;top:12px;width:14px;height:8px}
#stage.p #repere{width:56px;height:56px;font-size:30px}
#stage.p #tampon{font-size:30px;padding:12px 24px}
#stage.p #hub{width:1000px;height:640px}
#stage.p #hub .barre{height:64px;font-size:30px;padding:0 26px}
#stage.p #hub .barre i{width:14px;height:14px}
#stage.p #hub .h1{left:34px;top:94px;font-size:46px}
#stage.p #hub .h2{left:34px;top:158px;font-size:30px}
#stage.p #hub .round{right:34px;top:100px;font-size:30px;padding:10px 22px}
#stage.p .var{top:230px;transform:scale(1.0963);transform-origin:0 0}
#stage.p #va1{left:352px !important}
#stage.p #va2{left:670px !important}
#stage.p .vl{font-size:30px;font-weight:600;color:#5b6b7c;white-space:nowrap;top:546px !important}
#stage.p #vl0{left:34px !important}
#stage.p #vl1{left:352px !important}
#stage.p #vl2{left:670px !important}
#stage.p #toast{width:820px;box-sizing:border-box;padding:24px 28px;gap:20px}
#stage.p #toast .cl{width:64px;height:64px}
#stage.p #toast .cl svg{width:32px;height:32px}
#stage.p #toast b{font-size:34px}
#stage.p #toast span{font-size:30px}
</style>
</head>
<body>
<div id="stage">
  <div id="lueur"></div>
  <div id="titre">
    <div class="titre-acte" id="ta0"><div class="mask k"><span class="ln" data-txt="k0"></span></div><div class="mask t"><span class="ln" data-txt="t0a"></span></div><div class="mask t"><span class="ln" data-txt="t0b"></span></div></div>
    <div class="titre-acte" id="ta1"><div class="mask k"><span class="ln" data-txt="k1"></span></div><div class="mask t"><span class="ln" data-txt="t1a"></span></div><div class="mask t"><span class="ln" data-txt="t1b"></span></div></div>
    <div class="titre-acte" id="ta2"><div class="mask k"><span class="ln" data-txt="k2"></span></div><div class="mask t"><span class="ln" data-txt="t2a"></span></div><div class="mask t"><span class="ln" data-txt="t2b"></span></div></div>
  </div>

  <!-- Acte 3 : le Hub, derrière tout le reste. -->
  <div class="abs" id="hub">
    <div class="barre"><i></i><i></i><i></i><span>app.mydigipal.com</span></div>
    <div class="h1">Atelier Rivière</div>
    <div class="h2" data-txt="hub2"></div>
    <div class="round">Round 1 · V1</div>
    <div class="var" id="va1" style="left:345px;background:#24443a"><div class="halo abs" style="width:200px;height:200px;transform:translate(120px,-30px);opacity:.8"></div><div class="abs" id="lv1"></div><div class="tl abs" style="color:#f1e9dc;transform:translate(22px,150px)" data-txt="va1"></div></div>
    <div class="var" id="va2" style="left:650px;background:#f2c46d"><div class="abs" id="lv2"></div><div class="tl abs" style="transform:translate(22px,150px)" data-txt="va2"></div></div>
    <div class="vl abs" id="vl0" style="left:40px;top:478px" data-txt="vl0"></div>
    <div class="vl abs" id="vl1" style="left:345px;top:478px" data-txt="vl1"></div>
    <div class="vl abs" id="vl2" style="left:650px;top:478px" data-txt="vl2"></div>
  </div>

  <svg id="fils" viewBox="0 0 1080 1080"><path id="p0" pathLength="1"/><path id="p1" pathLength="1"/><path id="p2" pathLength="1"/><circle id="d0" r="7"/><circle id="d1" r="7"/><circle id="d2" r="7"/></svg>

  <div class="abs" id="kit">
    <h3 data-txt="kit"></h3>
    <div class="marque">ATELIER RIVIÈRE</div>
    <div class="r" data-txt="couleurs"></div>
    <div class="pastilles"><i style="background:#f1e9dc"></i><i style="background:#24443a"></i><i style="background:#1d2a24"></i><i style="background:#f2c46d"></i></div>
    <div class="r" data-txt="typo"></div>
    <div class="aa">Aa</div>
    <div class="r" data-txt="photos"></div>
    <div class="photos"><div id="ph1"></div><div id="ph2" style="background:#24443a"></div></div>
  </div>

  <div class="abs outil" id="o0"><div class="gl"><svg viewBox="0 0 24 24"><path id="glClaude"/></svg></div><div class="nom">Claude</div><div class="role" data-txt="r0"></div><div class="etat" data-txt="e0"></div>
    <div class="tuile"><div class="tx" id="tape"></div></div></div>
  <div class="abs outil" id="o1"><div class="gl"><svg viewBox="0 0 24 24"><path id="glGemini"/></svg></div><div class="nom">Nano Banana</div><div class="role" data-txt="r1"></div><div class="etat" data-txt="e1"></div>
    <div class="tuile"><canvas id="bruit" width="138" height="138"></canvas></div></div>
  <div class="abs outil" id="o2"><div class="gl"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></div><div class="nom">Higgsfield</div><div class="role" data-txt="r2"></div><div class="etat" data-txt="e2"></div>
    <div class="tuile v" id="mini"><div class="halo abs" id="miniHalo" style="width:110px;height:110px"></div><div class="abs" id="miniLampe"></div><div class="pb"><i id="miniPb"></i></div></div></div>

  <!-- La bannière assemblée, et ce qui y vole. -->
  <div class="abs" id="bn">
    <div class="halo" id="bnHalo"></div>
    <div class="logo" id="bnLogo" style="transform:translate(37px,37px)">ATELIER RIVIÈRE</div>
    <div class="sous" id="bnSous" style="transform:translate(37px,200px)" data-txt="sous"></div>
    <div class="cta" id="bnCta" style="transform:translate(37px,370px)" data-txt="cta"></div>
  </div>
  <div class="abs tl" id="volTitre"><div data-txt="l1"></div><div data-txt="l2"></div></div>
  <div class="abs" id="volLampe"></div>

  <div class="abs" id="relu">
    <div class="tete"><div class="av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.6 4.3-7 8.5-7s7.7 2.4 8.5 7z"/></svg></div><div><div class="qui" data-txt="qui"></div><div class="quoi" data-txt="quoi"></div></div></div>
    <div class="pt" id="pt0"><span class="c"><b></b></span><span data-txt="c0"></span></div>
    <div class="pt" id="pt1"><span class="c"><b></b></span><span data-txt="c1"></span></div>
    <div class="pt" id="pt2"><span class="c x" id="c2"><b></b></span><span data-txt="c2"></span></div>
    <div class="pt" id="pt3"><span class="c"><b></b></span><span data-txt="c3"></span></div>
  </div>
  <svg id="filRep" viewBox="0 0 1080 1080"><path id="fr" pathLength="1"/></svg>
  <div class="abs" id="repere">1</div>
  <div class="abs" id="tampon" data-txt="tampon"></div>

  <div class="abs" id="toast"><div class="cl"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg></div><div><b data-txt="toast"></b><span data-txt="toast2"></span></div></div>
</div>
<div id="prechargeur"><span style="font-family:'Plus Jakarta Sans';font-weight:800">a</span><span style="font-family:'Plus Jakarta Sans';font-weight:700">a</span><span style="font-family:Inter;font-weight:600">a</span></div>

<script>
var PORTRAIT = /[?&]p=1/.test(location.search);
window.STAGE = { w: 1080, h: PORTRAIT ? 1350 : 1080 };
window.DUREE = 19.6;

(function () {
  'use strict';
  var EN = /\/en\//.test(location.pathname) || /[?&]lang=en/.test(location.search);
  var TXT = EN ? {
    k0: '1 · AI produces', t0a: 'The best tools,', t0b: '<span class="o">on your brand</span>.',
    k1: '2 · Our creatives decide', t1a: 'Every file,', t1b: '<span class="o">checked by a human</span>.',
    k2: '3 · You receive', t2a: 'Fast.', t2b: 'And <span class="o">done right</span>.',
    kit: 'Your brand kit', couleurs: 'Colours', typo: 'Typeface', photos: 'Photos',
    r0: 'writes your copy', r1: 'creates your images', r2: 'animates your videos', e0: 'Copy', e1: 'Image', e2: 'Video',
    sous: 'Autumn collection', l1: 'Light,', l2: 'made by hand.', cta: 'Discover',
    qui: 'Art direction', quoi: 'checks every file',
    c0: 'True to your brand', c1: 'Readable when small', c2: 'The product, bigger', c3: 'No typos, right sizes',
