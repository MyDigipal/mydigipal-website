<script>
window.STAGE = { w: 1080, h: 1080 };
window.DUREE = 14;
window.PRET = Promise.all([
  document.fonts.load("800 58px 'Plus Jakarta Sans'"),
  document.fonts.load("600 22px 'Plus Jakarta Sans'"),
  document.fonts.load("500 30px 'Plus Jakarta Sans'")
]).then(function () { return document.fonts.ready; });
(function () {
'use strict';
var D = window.DUREE;
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function mix(a, b, p) { return a + (b - a) * p; }
function outExpo(p) { return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); }
function outCubic(p) { return 1 - Math.pow(1 - p, 3); }
function inCubic(p) { return p * p * p; }
function inOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
function outBack(p) { var c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
var $ = function (id) { return document.getElementById(id); };
var NS = 'http://www.w3.org/2000/svg';
function lignes(id, arr, cls) {
  $(id).innerHTML = arr.map(function (s, i) { return '<div class="mask"><span class="ln' + (cls && cls[i] ? ' ' + cls[i] : '') + '">' + s + '</span></div>'; }).join('');
}
function monte(t, sel, t0, pas) {
  var ls = document.querySelectorAll(sel);
  for (var j = 0; j < ls.length; j++) {
    var pe = outExpo(seg(t, t0 + j * (pas || 0.12), t0 + 0.8 + j * (pas || 0.12)));
    ls[j].style.transform = 'translateY(' + mix(125, 0, pe).toFixed(2) + '%)';
  }
}
function apparait(el, t, t0, dy, dur) {
  var p = outExpo(seg(t, t0, t0 + (dur || 0.6)));
  el.style.opacity = p.toFixed(3);
  el.style.transform = 'translateY(' + mix(dy === undefined ? 16 : dy, 0, p).toFixed(1) + 'px)';
  return p;
}
function svgEl(parent, nom, att) { var e = document.createElementNS(NS, nom); for (var a in att) e.setAttribute(a, att[a]); parent.appendChild(e); return e; }
/* un fil qui se dessine de 0 à 1, avec une tête lumineuse */
function fil(f, p, opa) {
  var len = f.p.getTotalLength();
  f.p.style.strokeDashoffset = (1 - p).toFixed(4);
  f.p.style.opacity = (p > 0 ? (opa === undefined ? 1 : opa) : 0).toFixed(3);
  var pt = f.p.getPointAtLength(len * p);
  f.tete.setAttribute('cx', pt.x.toFixed(1)); f.tete.setAttribute('cy', pt.y.toFixed(1));
  f.tete.style.opacity = (p > 0 && p < 1 ? 1 : 0);
}
function nouveauFil(svg, d, couleur) {
  return { p: svgEl(svg, 'path', { d: d, stroke: couleur || '#e8bd62', 'stroke-width': 2.5, fill: 'none', pathLength: 1, 'stroke-dasharray': '1 1' }),
           tete: svgEl(svg, 'circle', { r: 6, fill: '#fff4dc' }) };
}

/* Adapté le 13/10/2026 de la scène Google Search de l'audit Exaforce, pour une concession.
   Une seule source pour les deux langues : la copie de /motion/en/ parle anglais. Le seul
   chiffre est celui de l'étude de cas « open-days » (Vulcain, mars 2026). */
var EN = /\/motion\/en\//.test(location.pathname);
var TX_ = EN ? {
  titre: ['A car buyer searches,', 'the right campaign answers.'],
  leg: 'Example searches · ads mocked up for a dealership',
  sp: 'Sponsored', adn: 'Your dealership',
  nad: 'No ad shown', nads: '“jobs” is on the negative keyword list, so no budget is spent here',
  pT: 'Your Search campaigns', pS: 'One campaign per intent',
  cpt: 'Google conversions over ten days of open days at Vulcain, March 2026',
  rows: [['Your own name', 'Brand'], ['New cars, by brand', 'New'], ['Used cars', 'Used'], ['Open days', 'Event'], ['After-sales', 'Service']],
  q: [
    { q: 'used peugeot 3008 lyon', u: 'your-group.com › used › peugeot-3008', h: 'Used Peugeot 3008 in Lyon | Part-Exchange Welcome' },
    { q: 'kia open day rennes', u: 'your-group.com › open-days', h: 'Kia Open Days in Rennes | Book Your Test Drive' },
    { q: 'hyundai tucson hybrid price', u: 'your-group.com › hyundai › tucson', h: 'Hyundai Tucson Hybrid | Offer of the Month' }
  ],
  neg: 'car salesman jobs', loc: 'en-GB'
} : {
  titre: ['Un acheteur cherche,', 'la bonne campagne répond.'],
  leg: 'Recherches d’exemple · annonces maquettées pour une concession',
  sp: 'Sponsorisé', adn: 'Votre concession',
  nad: 'Aucune annonce', nads: '« emploi » est dans la liste des mots exclus : aucun budget dépensé ici',
  pT: 'Vos campagnes Search', pS: 'Une campagne par intention',
  cpt: 'conversions Google en dix jours de portes ouvertes chez Vulcain, en mars 2026',
  rows: [['Votre nom de marque', 'Nom'], ['Neuf, par marque', 'VN'], ['Occasion', 'VO'], ['Portes ouvertes', 'JPO'], ['Après-vente', 'APV']],
  q: [
    { q: 'peugeot 3008 occasion lyon', u: 'votre-groupe.fr › occasion › peugeot-3008', h: 'Peugeot 3008 d’Occasion à Lyon | Reprise de Votre Véhicule' },
    { q: 'portes ouvertes kia rennes', u: 'votre-groupe.fr › portes-ouvertes', h: 'Portes Ouvertes Kia à Rennes | Réservez Votre Essai' },
    { q: 'hyundai tucson hybride prix', u: 'votre-groupe.fr › hyundai › tucson', h: 'Hyundai Tucson Hybride | Offre du Mois et Essai' }
  ],
  neg: 'vendeur automobile emploi', loc: 'fr-FR'
};
document.documentElement.lang = EN ? 'en' : 'fr';
document.title = TX_.titre.join(' ');
lignes('titre', TX_.titre, ['', 'o']);
$('leg').textContent = TX_.leg;
$('sp').textContent = TX_.sp; $('adn').textContent = TX_.adn;
$('nadt').textContent = TX_.nad; $('nads').textContent = TX_.nads;
$('pTt').textContent = TX_.pT; $('pS').textContent = TX_.pS; $('cpt').textContent = TX_.cpt;

var ROWS = TX_.rows.map(function (r) { return { n: r[0], v: r[1] }; });
var TX = [100, 280, 460, 640, 820];
$('tiles').innerHTML = ROWS.map(function (r, i) {
  return '<div class="tile" id="r' + i + '" style="left:' + TX[i] + 'px"><b>' + r.n + '</b><em>' + r.v + '</em></div>';
}).join('');

var LIGNE = [2, 3, 1];
var Q = TX_.q.map(function (x, i) { return { q: x.q, row: LIGNE[i], u: x.u, h: x.h }; });
var B = [1.4, 4.5, 7.6], BN = 10.6, NEG = TX_.neg;
var svg = $('fils');
var FILS = Q.map(function (x) {
  var xc = TX[x.row] + 83;
  return nouveauFil(svg, 'M540,598 C540,632 ' + xc + ',630 ' + xc + ',664');
});

window.render = function (t) {
  t = clamp(+t || 0, 0, D);
  $('scene').style.opacity = (1 - inCubic(seg(t, 13.3, 13.9))).toFixed(3);
  monte(t, '#titre .ln', 0.3, 0.14);
  apparait($('srch'), t, 0.6, 24, 0.8);
  var pn = outExpo(seg(t, 0.8, 1.5));
  $('pan').style.clipPath = 'inset(0 0 ' + (100 * (1 - pn)).toFixed(2) + '% 0 round 24px)';
  monte(t, '#pT .ln', 1.0);
  $('pS').style.opacity = outExpo(seg(t, 1.2, 1.7)).toFixed(3);
  for (var i = 0; i < ROWS.length; i++) apparait($('r' + i), t, 1.1 + i * 0.08, 12, 0.6);

  var k = -1;
  for (var j = 0; j < 3; j++) if (t >= B[j] && t < B[j] + 3.0) k = j;
  var neg = t >= BN;
  var texte = '', b0 = 0;
  if (k >= 0) { texte = Q[k].q; b0 = B[k]; }
  else if (neg) { texte = NEG; b0 = BN; }
  var nb = Math.floor(texte.length * seg(t, b0, b0 + (neg ? 0.6 : 0.8)));
  $('qt').textContent = texte.slice(0, nb);
  var effacer = k >= 0 ? seg(t, b0 + 2.75, b0 + 3.0) : 0;
  $('q').style.opacity = (1 - effacer).toFixed(3);
  $('caret').style.opacity = (Math.floor(t * 2.4) % 2 === 0 || (nb > 0 && nb < texte.length)) ? 1 : 0;

  var ad = $('ad');
  if (k >= 0) {
    $('adh').textContent = Q[k].h; $('adu').textContent = Q[k].u;
    var pa = outExpo(seg(t, b0 + 1.0, b0 + 1.5));
    ad.style.opacity = (pa * (1 - effacer)).toFixed(3);
    ad.style.transform = 'translateY(' + mix(14, 0, pa).toFixed(1) + 'px)';
    var pc = seg(t, b0 + 1.7, b0 + 2.0), off = 1 - seg(t, b0 + 2.5, b0 + 2.8);
    ad.style.borderColor = 'rgba(232,189,98,' + (pc * off).toFixed(3) + ')';
    ad.style.background = 'rgba(232,189,98,' + (0.08 * pc * off).toFixed(3) + ')';
    var pr = seg(t, b0 + 1.7, b0 + 2.25), rp = $('ripple');
    rp.style.left = '470px'; rp.style.top = '270px';
    rp.style.opacity = (pr > 0 && pr < 1 ? 1 - pr : 0).toFixed(3);
    rp.style.transform = 'scale(' + mix(0.4, 2.6, outCubic(pr)).toFixed(3) + ')';
  } else { ad.style.opacity = 0; $('ripple').style.opacity = 0; }

  var pnad = neg ? outExpo(seg(t, BN + 0.75, BN + 1.25)) : 0;
  $('nad').style.opacity = pnad.toFixed(3);
  $('nad').style.transform = 'translateY(' + mix(12, 0, pnad).toFixed(1) + 'px)';

  FILS.forEach(function (f, n) {
    var p = outCubic(seg(t, B[n] + 1.85, B[n] + 2.45));
    fil(f, p, mix(1, 0.2, seg(t, B[n] + 2.6, B[n] + 3.1)));
  });
  for (var r = 0; r < ROWS.length; r++) {
    var n = -1; Q.forEach(function (x, m) { if (x.row === r) n = m; });
    var row = $('r' + r), em = row.querySelector('em');
    if (n < 0) { row.style.borderColor = 'rgba(125,184,238,.22)'; row.style.background = 'rgba(255,255,255,.02)'; em.style.color = '#a9b8c8'; continue; }
    var ta = B[n] + 2.45, pl = outExpo(seg(t, ta, ta + 0.4));
    var flash = t >= ta ? 1 - outCubic(seg(t, ta + 0.05, ta + 0.9)) : 0;
    row.style.borderColor = pl > 0 ? 'rgba(232,189,98,' + mix(0.35, 1, flash).toFixed(3) + ')' : 'rgba(125,184,238,.22)';
    row.style.background = pl > 0 ? 'rgba(16,48,77,' + mix(0.2, 1, pl).toFixed(3) + ')' : 'rgba(255,255,255,.02)';
    row.style.boxShadow = flash > 0 ? '0 0 0 ' + (4 * flash).toFixed(1) + 'px rgba(232,189,98,.22)' : '';
    em.style.color = pl > 0.5 ? '#e8bd62' : '#a9b8c8';
  }
  apparait($('compte'), t, 11.6, 12, 0.5);
  $('nb').textContent = Math.round(324 * outCubic(seg(t, 11.7, 12.8))).toLocaleString(TX_.loc);
  $('leg').style.opacity = outExpo(seg(t, 11.9, 12.5)).toFixed(3);
};
})();
