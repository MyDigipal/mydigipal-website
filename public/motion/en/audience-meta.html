<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les acheteurs autour de vous, le contact en dix secondes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#08131f;font-family:'Plus Jakarta Sans',sans-serif;color:#f4f7fa;-webkit-font-smoothing:antialiased}
#lueur{position:absolute;inset:0;background:radial-gradient(1100px 760px at 640px 560px,rgba(29,113,184,.16),rgba(8,19,31,0) 70%)}
#scene{position:absolute;inset:0}
.mask{overflow:hidden;padding:.06em 0 .2em;margin-bottom:-.14em}
.ln{display:block;transform:translateY(125%)}
#titre{position:absolute;left:110px;top:84px}
#titre .ln{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.06;white-space:nowrap}
.ln.o{color:#e8bd62}
.lab{position:absolute;font-size:19px;font-weight:600;color:#a9b8c8;line-height:1.3;white-space:nowrap}
.panneau{position:absolute;border-radius:24px;background:#0d2135;box-shadow:0 50px 100px -40px rgba(0,0,0,.8)}
.pT{position:absolute;font-size:22px;font-weight:700;letter-spacing:-.01em;color:#f4f7fa}
#leg{position:absolute;left:110px;top:1012px;font-size:15px;font-weight:600;color:#6f8399;white-space:nowrap}
#fils{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:6}
#prechargeur{position:absolute;left:-9999px;top:-9999px;visibility:hidden}
#leg{top:1022px}
#compte{position:absolute;left:110px;top:930px;display:flex;align-items:baseline;gap:14px;white-space:nowrap;z-index:5}
#compte b{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:#f4f7fa}
#compte span{font-size:19px;font-weight:600;color:#a9b8c8}
#compte span em{font-style:normal;color:#f4f7fa;font-weight:800}
#quand{position:absolute;right:110px;top:112px;height:40px;line-height:37px;box-sizing:border-box;padding:0 18px;border-radius:20px;border:1.5px solid rgba(232,189,98,.8);font-size:17px;font-weight:700;color:#e8bd62;white-space:nowrap}

#stage{width:1080px;height:1080px}
#lueur{background:radial-gradient(760px 640px at 540px 560px,rgba(29,113,184,.18),rgba(8,19,31,0) 72%)}
#fils{width:1080px;height:1080px}
#titre{left:70px;top:58px}
#titre .ln{font-size:58px}
#leg{left:70px;top:1034px;font-size:17px}
#compte{left:70px;top:900px}
#compte b{font-size:66px}
#compte span{font-size:23px;white-space:normal;max-width:640px;line-height:1.3}

.au{position:absolute;top:222px;width:298px;height:124px;box-sizing:border-box;border-radius:18px;background:#0d2135;border:1.5px solid rgba(125,184,238,.25);padding:16px 20px;z-index:3}
.au small{display:block;font-size:19px;font-weight:700;color:#a9b8c8;white-space:nowrap}
.au b{display:block;margin-top:8px;font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
#post{position:absolute;left:250px;top:400px;width:580px;box-sizing:border-box;border-radius:22px;background:#fff;color:#191919;box-shadow:0 50px 100px -40px rgba(0,0,0,.85);overflow:hidden;z-index:3}
#ph{display:flex;align-items:center;gap:12px;padding:18px 22px 0}
#ph .lo{flex:none;width:46px;height:46px;border-radius:10px;background:#0b1b2b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
#ph b{display:block;font-size:21px;font-weight:700}
#ph small{display:block;font-size:16px;color:#666;margin-top:2px}
#ph .li{margin-left:auto;flex:none;width:36px;height:36px;border-radius:7px;background:#1877F2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;letter-spacing:0;border-radius:50%}
#pt{padding:12px 22px 0;font-size:21px;line-height:1.38;color:#191919}
#pv{margin:14px 0 0;height:150px;background:linear-gradient(135deg,#0b1b2b 0%,#123a5e 70%,#1D71B8 100%);position:relative;overflow:hidden}
#pv b{position:absolute;left:24px;top:28px;font-size:40px;font-weight:800;line-height:1.08;letter-spacing:-.03em;color:#fff}
#pv b em{font-style:normal;color:#e8bd62}
#pv i{position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;border:2px solid rgba(125,184,238,.35)}
.st{position:absolute;top:760px;width:220px;height:104px;box-sizing:border-box;border-radius:16px;background:#0d2135;border:1.5px solid rgba(125,184,238,.25);padding:14px 16px;z-index:3}
.st b{display:block;font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
#dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#e8bd62;box-shadow:0 0 0 6px rgba(232,189,98,.22);z-index:6}
#cta{position:absolute;right:24px;bottom:22px;padding:10px 20px;border-radius:10px;background:#fff;color:#0b1b2b;font-size:20px;font-weight:700}
</style>
</head>
<body>
<div id="stage">
  <div id="lueur"></div>
  <div id="scene">
    <div id="titre"></div>
    <div class="au" id="a0" style="left:70px"><small></small><b></b></div>
    <div class="au" id="a1" style="left:391px"><small></small><b></b></div>
    <div class="au" id="a2" style="left:712px"><small></small><b></b></div>
    <div id="post">
      <div id="ph"><span class="lo">V</span><div><b id="phn"></b><small id="phs"></small></div><span class="li">f</span></div>
      <div id="pt"></div>
      <div id="pv"><i></i><b id="pvb"></b><span id="cta"></span></div>
    </div>
    <div class="st" id="s0" style="left:70px"><b></b></div>
    <div class="st" id="s1" style="left:310px"><b></b></div>
    <div class="st" id="s2" style="left:550px"><b></b></div>
    <div class="st" id="s3" style="left:790px"><b></b></div>
    <div id="dot"></div>
    <div id="compte"><b id="nb">0</b><span id="cpt"></span></div>
    <div id="leg"></div>
    <svg id="fils" viewBox="0 0 1080 1080"></svg>
  </div>
</div>
<div id="prechargeur">
  <span style="font-family:'Plus Jakarta Sans';font-weight:500">a</span>
  <span style="font-family:'Plus Jakarta Sans';font-weight:600">a</span>
  <span style="font-family:'Plus Jakarta Sans';font-weight:700">a</span>
  <span style="font-family:'Plus Jakarta Sans';font-weight:800">a</span>
</div>
<script>
window.STAGE = { w: 1080, h: 1080 };
window.DUREE = 14;
window.PRET = Promise.all([
  document.fonts.load("800 58px 'Plus Jakarta Sans'"),
  document.fonts.load("700 21px 'Plus Jakarta Sans'")
]).then(function () { return document.fonts.ready; });
(function () {
'use strict';
var D = window.DUREE;
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function mix(a, b, p) { return a + (b - a) * p; }
function outExpo(p) { return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); }
function outCubic(p) { return 1 - Math.pow(1 - p, 3); }
function inCubic(p) { return p * p * p; }
function inOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
function outBack(p) { var c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
var $ = function (id) { return document.getElementById(id); };
var NS = 'http://www.w3.org/2000/svg';
function lignes(id, arr, cls) {
  $(id).innerHTML = arr.map(function (s, i) { return '<div class="mask"><span class="ln' + (cls && cls[i] ? ' ' + cls[i] : '') + '">' + s + '</span></div>'; }).join('');
}
function monte(t, sel, t0, pas) {
  var ls = document.querySelectorAll(sel);
  for (var j = 0; j < ls.length; j++) {
    var pe = outExpo(seg(t, t0 + j * (pas || 0.12), t0 + 0.8 + j * (pas || 0.12)));
    ls[j].style.transform = 'translateY(' + mix(125, 0, pe).toFixed(2) + '%)';
  }
}
function apparait(el, t, t0, dy, dur) {
  var p = outExpo(seg(t, t0, t0 + (dur || 0.6)));
  el.style.opacity = p.toFixed(3);
  el.style.transform = 'translateY(' + mix(dy === undefined ? 16 : dy, 0, p).toFixed(1) + 'px)';
  return p;
}
function svgEl(parent, nom, att) { var e = document.createElementNS(NS, nom); for (var a in att) e.setAttribute(a, att[a]); parent.appendChild(e); return e; }
/* un fil qui se dessine de 0 à 1, avec une tête lumineuse */
function fil(f, p, opa) {
  var len = f.p.getTotalLength();
  f.p.style.strokeDashoffset = (1 - p).toFixed(4);
  f.p.style.opacity = (p > 0 ? (opa === undefined ? 1 : opa) : 0).toFixed(3);
  var pt = f.p.getPointAtLength(len * p);
  f.tete.setAttribute('cx', pt.x.toFixed(1)); f.tete.setAttribute('cy', pt.y.toFixed(1));
  f.tete.style.opacity = (p > 0 && p < 1 ? 1 : 0);
}
function nouveauFil(svg, d, couleur) {
  return { p: svgEl(svg, 'path', { d: d, stroke: couleur || '#e8bd62', 'stroke-width': 2.5, fill: 'none', pathLength: 1, 'stroke-dasharray': '1 1' }),
           tete: svgEl(svg, 'circle', { r: 6, fill: '#fff4dc' }) };
}

/* Adapté le 13/10/2026 de la scène LinkedIn de l'audit Exaforce, pour une concession sur
   Facebook et Instagram. Une seule source pour les deux langues : la copie de /motion/en/
   parle anglais. Le seul chiffre est celui de l'étude de cas « facebook-lead-ads » (DMD). */
var EN = /\/motion\/en\//.test(location.pathname);
var TX_ = EN ? {
  titre: ['Buyers near your dealership,', 'a lead in ten seconds.'],
  leg: 'Example targeting · ad mocked up for a dealership',
  au: [['Around the dealership', 'Your area'], ['Interested in', 'SUV, hybrid'], ['Already on your site', 'Retargeting']],
  phn: 'Your dealership', phs: 'Sponsored',
  pt: 'Open days this weekend: test drive the new hybrid SUV, with a part-exchange offer on site.',
  pvb: 'Try it<br><em>this weekend.</em>', cta: 'Sign up',
  st: ['Seen in the feed', 'Pre-filled form', 'To the right salesperson', 'Test drive booked'],
  cpt: 'instant form leads at DMD Group, January 2025 to October 2026', loc: 'en-GB'
} : {
  titre: ['Les acheteurs autour de vous,', 'le contact en dix secondes.'],
  leg: 'Ciblage d’exemple · annonce maquettée pour une concession',
  au: [['Autour de la concession', 'Votre zone'], ['Intéressés par', 'SUV, hybride'], ['Déjà venus sur le site', 'Remarketing']],
  phn: 'Votre concession', phs: 'Sponsorisé',
  pt: 'Portes ouvertes ce week-end : le nouveau SUV hybride à l’essai, avec une offre de reprise sur place.',
  pvb: 'Essayez-le<br><em>ce week-end.</em>', cta: 'S’inscrire',
  st: ['Vu dans le fil', 'Formulaire prérempli', 'Chez le bon vendeur', 'Essai réservé'],
  cpt: 'contacts par formulaire intégré chez le Groupe DMD, de janvier 2025 à octobre 2026', loc: 'fr-FR'
};
document.documentElement.lang = EN ? 'en' : 'fr';
document.title = TX_.titre.join(' ');
lignes('titre', TX_.titre, ['', 'o']);
$('leg').textContent = TX_.leg;
TX_.au.forEach(function (a, i) { var el = $('a' + i); el.querySelector('small').textContent = a[0]; el.querySelector('b').textContent = a[1]; });
$('phn').textContent = TX_.phn; $('phs').textContent = TX_.phs; $('pt').textContent = TX_.pt;
$('pvb').innerHTML = TX_.pvb; $('cta').textContent = TX_.cta;
TX_.st.forEach(function (s, i) { $('s' + i).querySelector('b').textContent = s; });
$('cpt').textContent = TX_.cpt;
var svg = $('fils');
var AX = [219, 540, 861];
var IN = AX.map(function (x) { return nouveauFil(svg, 'M' + x + ',346 C' + x + ',380 540,368 540,400', '#7db8ee'); });
var SX = [180, 420, 660, 900];
var OUT = SX.map(function (x) { return nouveauFil(svg, 'M540,712 C540,736 ' + x + ',734 ' + x + ',760'); });
var TS = [4.6, 6.0, 7.4, 9.0];

window.render = function (t) {
  t = clamp(+t || 0, 0, D);
  $('scene').style.opacity = (1 - inCubic(seg(t, 13.3, 13.9))).toFixed(3);
  monte(t, '#titre .ln', 0.3, 0.14);
  for (var i = 0; i < 3; i++) {
    var a = $('a' + i);
    apparait(a, t, 0.8 + i * 0.3, 14, 0.6);
    var b = a.querySelector('b'), v = b.getAttribute('data-v');
    if (v) b.textContent = Math.round(+v * outCubic(seg(t, 0.85 + i * 0.3, 1.9 + i * 0.3))).toLocaleString('en-US');
    fil(IN[i], outCubic(seg(t, 2.3 + i * 0.15, 2.9 + i * 0.15)), mix(1, 0.3, seg(t, 3.4, 4.0)));
  }
  apparait($('post'), t, 2.6, 22, 0.8);
  var dot = $('dot'), dx = 0, dy = 0, dv = 0;
  for (var n = 0; n < 4; n++) {
    var t0 = TS[n];
    fil(OUT[n], outCubic(seg(t, t0, t0 + 0.55)), mix(1, 0.25, seg(t, t0 + 0.8, t0 + 1.3)));
    var s = $('s' + n);
    apparait(s, t, t0 + 0.4, 12, 0.5);
    var on = t >= t0 + 0.55, fl = on ? 1 - outCubic(seg(t, t0 + 0.6, t0 + 1.4)) : 0, dem = n === 3 && on;
    s.style.borderColor = on ? 'rgba(232,189,98,' + mix(0.4, 1, fl).toFixed(3) + ')' : 'rgba(125,184,238,.25)';
    s.style.background = dem ? '#e8bd62' : (on ? '#10304d' : '#0d2135');
    s.querySelector('b').style.color = dem ? '#08131f' : '';
    s.style.boxShadow = fl > 0 ? '0 0 0 ' + (5 * fl).toFixed(1) + 'px rgba(232,189,98,.2)' : '';
    if (t >= t0 && t < t0 + 0.55) {
      var p = inOut(seg(t, t0, t0 + 0.55)), len = OUT[n].p.getTotalLength(), pt = OUT[n].p.getPointAtLength(len * p);
      dx = pt.x; dy = pt.y; dv = 1;
    }
  }
  dot.style.left = dx.toFixed(1) + 'px'; dot.style.top = dy.toFixed(1) + 'px'; dot.style.opacity = dv;
  apparait($('compte'), t, 11.0, 12, 0.5);
  $('nb').textContent = Math.round(7646 * outCubic(seg(t, 11.1, 12.2))).toLocaleString(TX_.loc);
  $('leg').style.opacity = outExpo(seg(t, 11.3, 11.9)).toFixed(3);
};
})();
</script>
<script src="/motion/lecteur.js"></script>
</body>
</html>
