<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The report that goes all the way to the sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
/* Le rapport MyDigipal qui relie les campagnes Facebook au CRM. On le voit se construire comme
   dans l'app : les campagnes jusqu'au contact, puis le CRM ajoute projets et ventes, le tri par
   coût de vente renverse le classement, la caméra tient sur la meilleure campagne, et le budget
   glisse vers ce qui vend. Phrases à gauche, objet à droite. Les chiffres viennent du jeu de données (?jeu=). */
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#08131f;font-family:'Plus Jakarta Sans',sans-serif;color:#f4f7fa;-webkit-font-smoothing:antialiased}
#fond{position:absolute;inset:0;background:radial-gradient(1100px 760px at 72% 52%,rgba(29,113,184,.26),transparent 70%),radial-gradient(600px 500px at 12% 80%,rgba(125,184,238,.06),transparent 70%)}
.leg{position:absolute;left:110px;width:470px}
.leg .mask{overflow:hidden;padding:.06em 0 .2em;margin-bottom:-.14em}
.leg .ln{display:block;font-size:46px;font-weight:800;line-height:1.08;letter-spacing:-.03em;transform:translateY(125%)}
.leg .ln.b{color:#7db8ee}
.leg .ln.o{color:#e8bd62}
.leg .num{display:block;font-size:15px;font-weight:700;letter-spacing:.16em;color:#7db8ee;margin-bottom:12px;opacity:0}
#cam{position:absolute;left:660px;top:150px;width:1180px;height:780px;transform-origin:0 0}
#app{position:absolute;inset:0;border-radius:18px;background:#f6f8fb;color:#0b1b2b;overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06)}
.barre{height:64px;display:flex;align-items:center;gap:22px;padding:0 26px;background:#fff;border-bottom:1px solid #e3e9f0}
.barre img{height:30px;display:block}
.fil{font-size:15px;font-weight:600;color:#5d7186}
.fil b{color:#0b1b2b}
.droite{margin-left:auto;display:flex;align-items:center;gap:16px}
.puce{font-size:14px;font-weight:600;color:#3d5268;background:#eef3f8;border-radius:999px;padding:8px 14px}
.bascule{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:#3d5268;background:#fff;border:1px solid #dbe3ec;border-radius:999px;padding:6px 14px 6px 8px}
.interr{position:relative;width:40px;height:24px;border-radius:999px;background:#cfd8e3}
.interr i{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tuiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:20px 26px 6px}
.tuile{background:#fff;border:1px solid #e3e9f0;border-radius:14px;padding:14px 16px}
.tuile span{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b7f93}
.tuile b{display:block;margin-top:6px;font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tuile.crm b{color:#1d71b8}
.tuile.or b{color:#b8862c}
.tableau{position:absolute;left:26px;right:26px;top:190px;bottom:22px;background:#fff;border:1px solid #e3e9f0;border-radius:14px;overflow:hidden}
.bande-crm{position:absolute;top:0;bottom:0;left:722px;right:0;background:linear-gradient(180deg,rgba(232,189,98,.11),rgba(232,189,98,.05));border-left:2px solid rgba(232,189,98,.55)}
.etiquette-crm{position:absolute;top:-1px;left:736px;font-size:11px;font-weight:800;letter-spacing:.14em;color:#b8862c;background:#fff6e2;border-radius:0 0 8px 8px;padding:4px 10px}
.entete,.ligne{position:absolute;left:0;right:0;display:grid;grid-template-columns:300px 110px 90px 100px 110px 130px 100px 1fr;align-items:center;padding:0 18px;column-gap:0}
.entete{top:26px;height:44px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6b7f93;border-bottom:1px solid #e3e9f0}
.entete span,.ligne span{text-align:right;padding-right:14px;white-space:nowrap}
.entete > span:first-of-type,.ligne > span:first-of-type{text-align:left}
.entete .tri{color:#1d71b8}
.ligne{height:72px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;border-bottom:1px solid #eef2f6}
.ligne .nom{display:block;font-weight:700;font-size:16.5px;color:#0b1b2b}
.ligne .sous{display:block;font-size:13px;font-weight:600;color:#7a8ea2;margin-top:2px}
.ligne .note{display:inline-block;margin-left:0;margin-top:4px;font-size:12px;font-weight:700;color:#8a6420;background:#fff3d9;border-radius:999px;padding:2px 9px}
.ligne .crm{color:#1d71b8;font-weight:700}
.ligne .cpv{font-weight:800}
.ligne .dep{position:relative}
.ligne .dep em{position:absolute;right:14px;bottom:-12px;height:4px;border-radius:2px;background:#1d71b8;font-style:normal}
.fond-ligne{position:absolute;inset:0;background:rgba(29,113,184,.07);opacity:0}
#tiroir{position:absolute;top:64px;right:0;bottom:0;width:430px;background:#fff;box-shadow:-30px 0 60px -20px rgba(11,27,43,.28);padding:28px 30px;transform:translateX(105%)}
#tiroir .k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6b7f93}
#tiroir h3{margin:6px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em}
#tiroir .s{font-size:14px;font-weight:600;color:#6b7f93}
.etage{display:grid;grid-template-columns:118px 1fr 52px;align-items:center;gap:12px;margin-top:16px;font-size:15px;font-weight:700}
.etage .lib{color:#3d5268}
.etage .bar{height:30px;border-radius:7px;background:#dfeaf6;position:relative;overflow:hidden}
.etage .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:#1d71b8}
.etage.or .bar i{background:#e0ab45}
.etage b{text-align:right;font-variant-numeric:tabular-nums;font-size:18px}
.resultat{margin-top:26px;border-top:1px solid #e3e9f0;padding-top:20px;display:flex;align-items:baseline;justify-content:space-between}
.resultat span{font-size:14px;font-weight:700;color:#6b7f93;text-transform:uppercase;letter-spacing:.08em}
.resultat b{font-size:40px;font-weight:800;color:#b8862c;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#curseur{position:absolute;left:0;top:0;width:26px;height:34px;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
#onde{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid #1d71b8;opacity:0}
#source{position:absolute;left:110px;bottom:52px;font-size:17px;font-weight:600;letter-spacing:.02em;color:#6f859b;white-space:nowrap;opacity:0}
#prechargeur{position:absolute;left:-9999px;top:-9999px;visibility:hidden}
</style>
</head>

var gab = [G[0]].concat(COLS.map(function (c, i) { return G[1 + i]; })).concat(COLS2.map(function (c, i) { return G[G.length - COLS2.length + i]; })).join(' ');
var largeurAvant = 18 + [G[0]].concat(COLS.map(function (c, i) { return G[1 + i]; })).reduce(function (s, w) { return s + parseFloat(w); }, 0);
$('bande').style.left = (largeurAvant - 6) + 'px';
$('etiq').style.left = (largeurAvant + 8) + 'px';
$('etiq').textContent = T(JEU.etiq);
$('fil').innerHTML = T(JEU.fil);
$('periode').textContent = T(JEU.periode);
$('bascule-txt').textContent = T(JEU.bascule);
$('source').textContent = T(JEU.source);
var entete = $('entete');
entete.style.gridTemplateColumns = gab;
var triCol = null;
entete.innerHTML = '<span>' + T(TI.k) + '</span>' + COLS.map(function (c) { return '<span>' + T(c.lab) + '</span>'; }).join('') +
  COLS2.map(function (c) { return '<span data-c' + (c.k === TRI.k ? ' data-tri' : '') + '>' + T(c.lab) + '</span>'; }).join('');
triCol = entete.querySelector('[data-tri]');
var triLib = triCol ? triCol.textContent : '';
var legs = [0, 1, 2].map(function (i) { return $('leg' + i); });
legs.forEach(function (l, i) { var lns = l.querySelectorAll('.ln'); lns[0].textContent = T(JEU.legs[i][0]); lns[1].textContent = T(JEU.legs[i][1]); });

var lignes = $('lignes');
R.forEach(function (r, i) {
  var d = document.createElement('div');
  d.className = 'ligne'; d.id = 'l' + i;
  d.style.gridTemplateColumns = gab;
  var note = JEU.note && JEU.note.i === i ? '<i class="note" style="font-style:normal">' + T(JEU.note.txt) + '</i>' : '';
  d.innerHTML = '<div class="fond-ligne"></div><span><b class="nom">' + T(r.nom) + '</b><i class="sous" style="font-style:normal">' + T(r.sous) + '</i>' + note + '</span>' +
    COLS.map(function (c, j) { return j === 0 && A_DEP ? '<span class="dep"><b data-v="' + c.k + '">0</b><em></em></span>' : '<span data-v="' + c.k + '">0</span>'; }).join('') +
    COLS2.map(function (c, j) { return '<span class="' + (j === COLS2.length - 1 ? 'cpv' : 'crm') + '" data-v="' + c.k + '"></span>'; }).join('');
  lignes.appendChild(d);
});
var tuiles = $('tuiles');
tuiles.style.gridTemplateColumns = 'repeat(' + JEU.tuiles.length + ',1fr)';
tuiles.innerHTML = JEU.tuiles.map(function (k) { return '<div class="tuile' + (k.or ? ' or' : (k.crm ? ' crm' : '')) + '"><span>' + T(k.lab) + '</span><b>' + VIDE + '</b></div>'; }).join('');
var K = [].slice.call(tuiles.querySelectorAll('b'));
$('tiroir-k').textContent = T(TI.k);
$('tiroir-nom').textContent = T(R[TI.i].nom);
$('tiroir-sous').textContent = T(TI.sous);
$('tres-lib').textContent = T(TI.res.lab);
var etages = $('etages');
var E0 = TI.etages[0][1];
TI.etages.forEach(function (e, i) {
  if (e[2] == null) e[2] = 0.12 + 0.88 * Math.sqrt(e[1] / E0);
  var d = document.createElement('div');
  d.className = 'etage' + (i === TI.etages.length - 1 ? ' or' : '');
  d.innerHTML = '<span class="lib">' + T(e[0]) + '</span><span class="bar"><i></i></span><b>0</b>';
  etages.appendChild(d);
});
/* Un libellé trop long pour sa colonne est réduit, jamais coupé. */
[].forEach.call(document.querySelectorAll('.ligne .nom, .entete span, .tuile span'), function (el) {
  var w = el.clientWidth;
  if (el.scrollWidth > w && w > 0) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * w / el.scrollWidth).toFixed(1) + 'px';
});

var cam = $('cam'), curseur = $('curseur'), onde = $('onde'), tiroir = $('tiroir'), pastille = $('pastille'), interr = $('interr'), source = $('source');
var hC = [].slice.call(entete.querySelectorAll('[data-c]'));

/* Les clés de la caméra : elle tient chaque pose, puis glisse vers la suivante. */
var CAM = [
  { t: 0, s: 1, x: 0, y: 0 },
  { t: 10.6, s: 1, x: 0, y: 0 },
  { t: 11.3, s: 1.12, x: -96, y: -112 },
  { t: 13.7, s: 1.12, x: -96, y: -112 },
  { t: 14.4, s: 1, x: 0, y: 0 }
];
function camera(t) {
  for (var i = CAM.length - 1; i >= 0; i--) if (t >= CAM[i].t) break;
  var a = CAM[Math.max(i, 0)], b = CAM[Math.min(i + 1, CAM.length - 1)];
  if (a === b) return a;
  var p = inOutCubic(seg(t, a.t, b.t));
  return { s: mix(a.s, b.s, p), x: mix(a.x, b.x, p), y: mix(a.y, b.y, p) };
}
/* Le curseur : positions dans l'app, et les instants de clic. La bascule est mesurée, sa largeur suit son libellé. */
/* Centre d'un élément (ou de son texte), en coordonnées de l'app, mesuré avant toute transformation. */
function centreDans(el, texte) {
  var a = $('app').getBoundingClientRect(), r;
  if (texte) { var g = document.createRange(); g.selectNodeContents(el); r = g.getBoundingClientRect(); } else r = el.getBoundingClientRect();
  var k = a.width / ($('app').offsetWidth || a.width);
  return [(r.left + r.width / 2 - a.left) / k, (r.top + r.height / 2 - a.top) / k];
}
var bx = centreDans(interr)[0] - 6;
var CUR = [
  { t: 0, x: 980, y: 720 }, { t: 4.4, x: 980, y: 720 }, { t: 5.2, x: bx, y: 30 }, { t: 8.5, x: bx, y: 30 },
  { t: 9.2, x: 1075, y: 236 }, { t: 10.6, x: 1075, y: 236 }, { t: 11.1, x: 420, y: 300 }, { t: 13.9, x: 420, y: 300 }, { t: 14.6, x: 700, y: 760 }
];
var CLICS = [5.35, 9.35, 11.25];
function curseurA(t) {
  for (var i = CUR.length - 1; i >= 0; i--) if (t >= CUR[i].t) break;
  var a = CUR[Math.max(i, 0)], b = CUR[Math.min(i + 1, CUR.length - 1)];
  if (a === b) return a;
  var p = inOutCubic(seg(t, a.t, b.t));
  return { x: mix(a.x, b.x, p), y: mix(a.y, b.y, p) };
}
/* Le clic de tri vise l'en-tête de la colonne triée, la tenue vise la ligne du tiroir. */
if (triCol) { CUR[4].x = CUR[5].x = centreDans(triCol, true)[0] - 6; }

window.render = function (t) {
  t = clamp(+t || 0, 0, D);
  var fin = seg(t, 20.2, 21);

  /* l'app entre, légèrement inclinée, puis se pose */
  var e = outExpo(seg(t, 0.15, 1.3)), c = camera(t);
  var rx = 9 * (1 - e), ty = 70 * (1 - e) + 30 * inCubic(fin);
  cam.style.transform = 'perspective(2200px) translate(' + c.x.toFixed(1) + 'px,' + (c.y + ty).toFixed(1) + 'px) scale(' + c.s.toFixed(4) + ') rotateX(' + rx.toFixed(2) + 'deg)';
  cam.style.opacity = (Math.min(seg(t, 0.15, 0.6), 1 - fin)).toFixed(3);
  source.style.opacity = (outQuart(seg(t, 1.0, 1.8)) * (1 - fin)).toFixed(3);

  /* les trois phrases, chacune à sa place ; la phrase en cours est claire, les autres passent en retrait */
  var LT = [0.6, 5.5, 14.3];
  legs.forEach(function (l, i) {
    var lns = l.querySelectorAll('.ln');
    for (var j = 0; j < lns.length; j++) {
      var p = outBack(1.3)(seg(t, LT[i] + j * 0.12, LT[i] + 0.8 + j * 0.12)), x = inBack(1.2)(seg(t, 20.0 + j * 0.06, 20.5 + j * 0.06));
      lns[j].style.transform = 'translateY(' + (x > 0 ? mix(0, 135, x) : mix(125, 0, p)).toFixed(2) + '%)';
    }
    var suivante = i < 2 ? LT[i + 1] : 99;
    l.style.opacity = (1 - 0.62 * outQuart(seg(t, suivante, suivante + 0.6))).toFixed(3);
  });

  /* les lignes du tableau : elles entrent une à une, leurs chiffres montent */
  var tri = inOutCubic(seg(t, 9.5, 10.6)), crm = seg(t, 5.6, 6.1), budget = BUDGET ? inOutCubic(seg(t, 15.0, 16.4)) : 0;
  R.forEach(function (r, i) {
    var el = $('l' + i), t0 = 1.2 + i * 0.32, p = outExpo(seg(t, t0, t0 + 0.6)), v = outQuart(seg(t, t0 + 0.1, t0 + 1.4));
    var y = 70 + mix(i, r.rang, tri) * 72;
    el.style.top = y.toFixed(1) + 'px';
    el.style.opacity = p.toFixed(3);
    el.style.transform = 'translateX(' + (24 * (1 - p)).toFixed(1) + 'px)';
    COLS.forEach(function (col, j) {
      var x = el.querySelector('[data-v=' + col.k + ']');
      if (j === 0 && A_DEP) {
        var dep = mix(r.dep, r.apres, budget);
        x.textContent = fmt(r.dep * v + (dep - r.dep), col.f);
        x.style.color = r.apres > r.dep && budget > 0 ? '#1d71b8' : (r.apres < r.dep && budget > 0 ? '#7a8ea2' : '');
        var barre = el.querySelector('em');
        barre.style.width = (70 * dep / MAXDEP * outQuart(seg(t, 14.6, 15.0))).toFixed(1) + 'px';
        barre.style.background = r.apres > r.dep ? '#1d71b8' : (r.apres < r.dep ? '#b8c6d4' : '#7db8ee');
      } else if (col.calc) x.textContent = v > 0.98 ? fmt(r[col.k], col.f) : '';
      else x.textContent = fmt(r[col.k] * v, col.f);
    });
    /* les colonnes ajoutées se remplissent ligne après ligne */
    var tc = 6.3 + i * 0.36, q = outQuart(seg(t, tc, tc + 0.9));
    COLS2.forEach(function (col, j) {
      var x = el.querySelector('[data-v=' + col.k + ']');
      x.textContent = q <= 0 ? '' : (col.calc ? (q > 0.97 ? fmt(r[col.k], col.f) : '') : fmt(r[col.k] * q, col.f));
      x.style.opacity = q.toFixed(3);
      if (j === COLS2.length - 1) x.style.color = r.rang === 0 ? '#b8862c' : '#0b1b2b';
    });
    /* la ligne du tiroir prend un fond, la note s'écrit après le tri */
    el.querySelector('.fond-ligne').style.opacity = (i === TI.i ? outQuart(seg(t, 10.3, 10.8)) : 0).toFixed(3);
    el.querySelector('.fond-ligne').style.background = 'rgba(232,189,98,.16)';
    var note = el.querySelector('.note');
    if (note) { note.style.clipPath = 'inset(-4px ' + (100 * (1 - outQuart(seg(t, 10.6, 11.2)))).toFixed(1) + '% -4px 0)'; note.style.display = t > 10.55 ? 'inline-block' : 'none'; }
    el.querySelector('.sous').style.display = note && t > 10.55 ? 'none' : 'block';
  });
  hC.forEach(function (h, j) { var p = outQuart(seg(t, 5.8 + j * 0.15, 6.3 + j * 0.15)); h.style.opacity = p.toFixed(3); h.style.transform = 'translateY(' + (8 * (1 - p)).toFixed(1) + 'px)'; });
  if (triCol) { triCol.className = t > 9.35 ? 'tri' : ''; triCol.textContent = triLib + (t > 9.35 ? (TRI.sens > 0 ? ' ↑' : ' ↓') : ''); }
  $('bande').style.opacity = crm.toFixed(3);
  $('bande').style.transform = 'scaleY(' + outExpo(crm).toFixed(3) + ')';
  $('bande').style.transformOrigin = '0 0';
  $('etiq').style.opacity = outQuart(seg(t, 5.9, 6.3)).toFixed(3);

  /* la bascule */
  var on = outExpo(seg(t, 5.35, 5.6));
  pastille.style.transform = 'translateX(' + (16 * on).toFixed(1) + 'px)';
  interr.style.background = on > 0.5 ? '#1d71b8' : '#cfd8e3';

  /* les tuiles du haut */
  var kv = outQuart(seg(t, 1.4, 3.2)), kc = outQuart(seg(t, 6.4, 8.4));
  JEU.tuiles.forEach(function (k, i) {
    var p = k.crm ? kc : kv;
    if (k.txt) { K[i].textContent = p > 0.97 ? T(k.txt) : VIDE; return; }
    if (k.f === 'prix' || k.f === 'pct' || (k.or && k.crm)) { K[i].textContent = p > 0.97 ? fmt(k.v, k.f) : VIDE; return; }
    K[i].textContent = p > 0 ? fmt(k.v * p, k.f) : VIDE;
  });

  /* le tiroir de la ligne mise en avant */
  var ti = outExpo(seg(t, 11.35, 12.0)) * (1 - inOutCubic(seg(t, 13.7, 14.2)));
  tiroir.style.transform = 'translateX(' + (105 * (1 - ti)).toFixed(2) + '%)';
  [].forEach.call(etages.children, function (d, i) {
    var p = outQuart(seg(t, 11.8 + i * 0.22, 12.4 + i * 0.22));
    d.querySelector('i').style.width = (100 * TI.etages[i][2] * p).toFixed(1) + '%';
    d.querySelector('b').textContent = fmt(TI.etages[i][1] * p, 'ent');
  });
  var pr = outQuart(seg(t, 12.7, 13.3));
  $('tres').textContent = fmt(TI.res.v * pr, TI.res.f);

  /* le curseur et son onde au clic */
  var cu = curseurA(t), vis = Math.min(seg(t, 3.9, 4.3), 1 - seg(t, 15.0, 15.4));
  curseur.style.transform = 'translate(' + cu.x.toFixed(1) + 'px,' + cu.y.toFixed(1) + 'px)';
  curseur.style.opacity = vis.toFixed(3);
  var on2 = 0;
  CLICS.forEach(function (tc) { var p = seg(t, tc, tc + 0.45); if (p > 0 && p < 1) { on2 = p; } });
  onde.style.opacity = on2 > 0 ? (1 - on2).toFixed(3) : '0';
  onde.style.transform = 'translate(' + (cu.x + 3).toFixed(1) + 'px,' + (cu.y + 3).toFixed(1) + 'px) scale(' + (0.4 + 1.2 * outQuart(on2)).toFixed(3) + ')';
};
})();
</script>
<script src="/motion/lecteur.js"></script>
</body>
</html>
