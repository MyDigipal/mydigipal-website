<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Du storyboard à la vidéo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
/* Page Creative design, les vidéos (Paul, 20/10/2026). Ce que coûte une vidéo et ce qu'on reçoit :
   1. le storyboard : trois cases dessinées au trait, leur durée et ce qui s'y passe, puis validé ;
   2. le motion design : les cases prennent leurs couleurs, descendent en pellicule, et la tête de
      lecture les joue l'une après l'autre dans le lecteur, au-dessus ;
   3. ou le storyboard seul : la planche revient, prête à remettre à votre équipe (l'offre à part).
   Marque fictive Atelier Rivière. render(t) est pur. */
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#08131f;font-family:'Plus Jakarta Sans',sans-serif;color:#f4f7fa;-webkit-font-smoothing:antialiased}
#lueur{position:absolute;inset:0;background:radial-gradient(900px 700px at 85% -10%,rgba(29,113,184,.30),rgba(8,19,31,0) 65%),radial-gradient(700px 600px at 0% 110%,rgba(232,189,98,.08),rgba(8,19,31,0) 60%)}
.mask{overflow:hidden;padding:.06em 0 .2em;margin-bottom:-.14em}
.ln{display:block;transform:translateY(140%);white-space:nowrap}
#titre{position:absolute;left:72px;top:64px;z-index:9}
.titre-acte{position:absolute;left:0;top:0}
#titre .k .ln{font-size:30px;font-weight:700;color:#7DB8EE;letter-spacing:.01em;margin-bottom:12px}
#titre .t .ln{font-size:60px;font-weight:800;letter-spacing:-.035em;line-height:1.04}
#titre .t .ln .o{color:#e8bd62}
.abs{position:absolute;left:0;top:0}

#planche{width:960px;height:460px;border-radius:26px;background:#f7f4ee;color:#0b1b2b;box-shadow:0 70px 140px -60px rgba(0,0,0,.95);z-index:3;transform-origin:50% 0}
#planche .tete{position:absolute;left:40px;top:30px;font-family:Inter,sans-serif;font-size:21px;font-weight:600;color:#5b6b7c;white-space:nowrap}
#valide{position:absolute;right:40px;top:24px;padding:9px 18px;border-radius:999px;background:#e8f6ee;color:#127a4a;font-family:Inter,sans-serif;font-size:19px;font-weight:600;transform-origin:100% 50%;white-space:nowrap}
#pdf{position:absolute;right:40px;top:24px;padding:9px 18px;border-radius:999px;background:#1D71B8;color:#fff;font-family:Inter,sans-serif;font-size:19px;font-weight:600;display:flex;gap:8px;align-items:center;transform-origin:100% 50%;white-space:nowrap}
.case{position:absolute;top:84px;width:272px}
.case .cadre{position:relative;width:272px;height:153px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px #d9d2c4;overflow:hidden}
.case .cadre svg{position:absolute;inset:0}
.case .trait path,.case .trait line,.case .trait rect,.case .trait circle,.case .trait ellipse{fill:none;stroke:#8b97a3;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.case .num{margin-top:16px;font-size:22px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.case .num span{font-family:Inter,sans-serif;font-size:18px;font-weight:600;color:#1D71B8;margin-left:8px}
.case .txt{margin-top:6px;font-family:Inter,sans-serif;font-size:19px;font-weight:600;color:#4b5b6b;line-height:1.4}
.case .ecran{margin-top:10px;font-family:Inter,sans-serif;font-size:17px;font-weight:600;color:#8a6512;background:#fdf3dc;border-radius:10px;padding:8px 12px;line-height:1.35}

/* Le lecteur */
#lecteur{width:800px;height:450px;border-radius:22px;overflow:hidden;background:#1d2a24;box-shadow:0 60px 120px -50px rgba(0,0,0,.95);z-index:4}
#lecteur > *{position:absolute;left:0;top:0;transform-origin:0 0}
.halo{border-radius:50%;background:radial-gradient(closest-side,rgba(246,196,98,.8),rgba(246,196,98,.25) 55%,rgba(246,196,98,0))}
#vTitre{font-size:62px;font-weight:800;letter-spacing:-.04em;line-height:1.02;color:#f1e9dc;white-space:nowrap}
#vCta{font-family:Inter,sans-serif;font-size:24px;font-weight:600;color:#1d2a24;background:#f1e9dc;border-radius:999px;padding:14px 28px;white-space:nowrap}
#vLogo{font-family:Inter,sans-serif;font-size:18px;font-weight:600;letter-spacing:.2em;color:#f1e9dc;white-space:nowrap}
#vTemps{font-family:Inter,sans-serif;font-size:17px;font-weight:600;color:rgba(241,233,220,.75);white-space:nowrap}

/* La pellicule */
#pellicule{width:800px;height:150px;z-index:4}
.vig{position:absolute;top:0;width:252px;height:142px;border-radius:12px;overflow:hidden;background:#1d2a24;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
#tete{position:absolute;top:-14px;width:4px;height:170px;border-radius:4px;background:#e8bd62;z-index:5}
#tete:before{content:'';position:absolute;left:-8px;top:-6px;width:20px;height:14px;border-radius:4px;background:#e8bd62}
.vlab{position:absolute;top:154px;font-family:Inter,sans-serif;font-size:18px;font-weight:600;color:#a9b8c8;white-space:nowrap}
#prechargeur{position:absolute;left:-9999px;top:-9999px;visibility:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="lueur"></div>
  <div id="titre">
    <div class="titre-acte" id="ta0"><div class="mask k"><span class="ln" data-txt="k0"></span></div><div class="mask t"><span class="ln" data-txt="t0a"></span></div><div class="mask t"><span class="ln" data-txt="t0b"></span></div></div>
    <div class="titre-acte" id="ta1"><div class="mask k"><span class="ln" data-txt="k1"></span></div><div class="mask t"><span class="ln" data-txt="t1a"></span></div><div class="mask t"><span class="ln" data-txt="t1b"></span></div></div>
    <div class="titre-acte" id="ta2"><div class="mask k"><span class="ln" data-txt="k2"></span></div><div class="mask t"><span class="ln" data-txt="t2a"></span></div><div class="mask t"><span class="ln" data-txt="t2b"></span></div></div>
  </div>

  <div class="abs" id="lecteur">
    <div class="halo" id="vHalo"></div>
    <div id="vLampe"></div>
    <div id="vLogo">ATELIER RIVIÈRE</div>
    <div id="vTitre"><div id="vl1"></div><div id="vl2"></div></div>
    <div id="vCta"></div>
    <div id="vTemps"></div>
  </div>
  <div class="abs" id="pellicule"><div id="tete"></div></div>

  <div class="abs" id="planche">
    <div class="tete" data-txt="tete"></div>
    <div id="valide"><span data-txt="valide"></span></div>
    <div id="pdf"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-txt="pdf"></span></div>
  </div>
</div>
<div id="prechargeur"><span style="font-family:'Plus Jakarta Sans';font-weight:800">a</span><span style="font-family:'Plus Jakarta Sans';font-weight:700">a</span><span style="font-family:Inter;font-weight:600">a</span></div>

<script>
window.STAGE = { w: 1080, h: 1080 };
window.DUREE = 18;

(function () {
  'use strict';
  var EN = /\/en\//.test(location.pathname) || /[?&]lang=en/.test(location.search);
  var TXT = EN ? {
    k0: '1 · The storyboard', t0a: 'Three scenes,', t0b: '<span class="o">agreed before we produce</span>.',
    k1: '2 · The motion design', t1a: 'Every frame', t1b: '<span class="o">becomes a shot</span>.',
    k2: '3 · Or the storyboard alone', t2a: 'For your own team,', t2b: '<span class="o">ready to produce</span>.',
    tete: 'Atelier Rivière · 15-second video · storyboard', valide: 'Approved', pdf: 'Storyboard, PDF',
    c: [['Scene 1', '0 to 4 s', 'A dark room. The lamp comes down on its cord.', ''],
        ['Scene 2', '4 to 9 s', 'The light comes on and fills the frame.', ''],
        ['Scene 3', '9 to 15 s', 'The message, then the button.', 'On screen: “Light, made by hand.”']],
    l1: 'Light,', l2: 'made by hand.', cta: 'Discover'
  } : {
    k0: '1 · Le storyboard', t0a: 'Trois scènes,', t0b: '<span class="o">validées avant de produire</span>.',
    k1: '2 · Le motion design', t1a: 'Chaque case', t1b: '<span class="o">devient un plan</span>.',
    k2: '3 · Ou le storyboard seul', t2a: 'Pour votre équipe,', t2b: '<span class="o">prêt à produire</span>.',
    tete: 'Atelier Rivière · vidéo de 15 s · storyboard', valide: 'Validé', pdf: 'Storyboard, PDF',
    c: [['Scène 1', '0 à 4 s', 'Une pièce sombre. La lampe descend de son cordon.', ''],
        ['Scène 2', '4 à 9 s', 'La lumière s’allume et remplit l’image.', ''],
        ['Scène 3', '9 à 15 s', 'Le message, puis le bouton.', 'À l’écran : « La lumière, faite main. »']],
    l1: 'La lumière,', l2: 'faite main.', cta: 'Découvrir'
  };
  if (EN) document.documentElement.lang = 'en';
  document.querySelectorAll('[data-txt]').forEach(function (n) { n.innerHTML = TXT[n.getAttribute('data-txt')]; });
  document.getElementById('vl1').textContent = TXT.l1; document.getElementById('vl2').textContent = TXT.l2; document.getElementById('vCta').textContent = TXT.cta;

  function c01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function seg(t, a, b) { return c01((t - a) / (b - a)); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function bez(x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    return function (x) { var t = x; for (var i = 0; i < 8; i++) { var d = (3 * ax * t + 2 * bx) * t + cx, e = ((ax * t + bx) * t + cx) * t - x; if (Math.abs(e) < 1e-5 || !d) break; t -= e / d; } t = c01(t); return ((ay * t + by) * t + cy) * t; };
  }
  var A = bez(0.15, 1, 0.32, 1);
  var S = bez(0.333, 0, 0.667, 0);
  function ressort(x) { if (x <= 0) return 0; if (x >= 1) return 1; var z = 0.5, w = 10; var wd = w * Math.sqrt(1 - z * z); var e = Math.exp(-z * w * x); return 1 - e * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x)); }
  var $ = function (id) { return document.getElementById(id); };
  function pose(el, x, y, o, extra) { el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)' + (extra || ''); el.style.opacity = o; }

  function lampe(w, couleur, haut) {
    return '<svg width="' + w + '" height="' + (w * 1.6) + '" viewBox="0 0 100 160" style="overflow:visible"><line x1="50" y1="' + (haut === undefined ? -900 : haut) + '" x2="50" y2="62" stroke="' + (couleur ? '#0b1410' : '#1d2a24') + '" stroke-width="1.6"/>' +
      '<rect x="44" y="58" width="12" height="8" rx="2" fill="#0b1410"/><path d="M6,108 C6,80 27,64 50,64 C73,64 94,80 94,108 Z" fill="' + (couleur || '#24443a') + '"/>' +
      '<ellipse cx="50" cy="108" rx="44" ry="5" fill="#183128"/><circle class="amp" cx="50" cy="111" r="8" fill="#d8cfc0"/></svg>';
  }

  /* Les trois cases : un dessin au trait (le storyboard) et sa version en couleurs (le plan). */
  var TRAITS = [
    '<path d="M0 118 L272 118"/><line x1="150" y1="0" x2="150" y2="34" /><path d="M120 58 C120 42 132 34 150 34 C168 34 180 42 180 58 Z"/><path d="M150 4 L150 22" stroke-dasharray="4 6"/><path d="M196 30 l0 22 M190 46 l6 6 6 -6"/>',
    '<line x1="136" y1="0" x2="136" y2="40"/><path d="M100 70 C100 50 115 40 136 40 C157 40 172 50 172 70 Z"/><circle cx="136" cy="74" r="6"/><path d="M110 92 L84 124 M136 96 L136 132 M162 92 L188 124" stroke-dasharray="5 7"/><path d="M60 80 L76 80 M196 80 L212 80"/>',
    '<rect x="24" y="44" width="150" height="16" rx="4"/><rect x="24" y="68" width="110" height="16" rx="4"/><rect x="24" y="100" width="70" height="22" rx="11"/><line x1="214" y1="0" x2="214" y2="24"/><path d="M190 44 C190 31 200 24 214 24 C228 24 238 31 238 44 Z"/>'
  ];
  var planche = $('planche'), CASES = [];
  TXT.c.forEach(function (c, i) {
    var d = document.createElement('div'); d.className = 'case'; d.style.left = (40 + i * 304) + 'px';
    d.innerHTML = '<div class="cadre"><div class="abs couleur" style="inset:0;width:272px;height:153px"></div><svg class="trait" viewBox="0 0 272 153">' + TRAITS[i] + '</svg></div>' +
      '<div class="num">' + c[0] + '<span>' + c[1] + '</span></div><div class="txt">' + c[2] + '</div>' + (c[3] ? '<div class="ecran">' + c[3] + '</div>' : '');
    planche.appendChild(d); CASES.push(d);
    d.querySelectorAll('.trait > *').forEach(function (p) { p.setAttribute('pathLength', '1'); p.style.strokeDasharray = p.getAttribute('stroke-dasharray') ? '' : '1'; });
  });

  /* Le plan d'une vidéo à l'instant v (0 à 15 s), dans n'importe quel cadre de largeur w. */
  function plan(v, w) {
    var h = w * 9 / 16, u = w / 800;
    var chute = 1 - ressort(seg(v, 0.4, 3.2));
    var lum = v > 4.2 ? 1 : 0;
    if (v > 4.2 && v < 4.7) lum = Math.sin(v * 70) > -.2 ? 1 : .3;
    var lw = 170 * u, lx = w * 0.62, ly = -lw * 0.2 + chute * -(lw * 1.6);
    var titre = A(seg(v, 9.0, 10.0)), titre2 = A(seg(v, 9.3, 10.3)), cta = A(seg(v, 11.0, 11.8));
    return { u: u, h: h, lw: lw, lx: lx, ly: ly, lum: lum, glow: lum * (0.85 + 0.15 * Math.sin(v * 2.4)), titre: titre, titre2: titre2, cta: cta, bal: v > 3 ? Math.sin((v - 3) * 2.1) * 4 * Math.exp(-(v - 3) * .25) : 0 };
  }
  function vignette(el, v) {
    var w = 252, p = plan(v, w);
    var s = '<div style="position:absolute;left:' + (p.lx + p.lw / 2 - p.lw * 1.3) + 'px;top:' + (p.ly + p.lw * 1.1 - p.lw * 1.3) + 'px;width:' + (p.lw * 2.6) + 'px;height:' + (p.lw * 2.6) + 'px;opacity:' + p.glow + '" class="halo"></div>';
    s += '<div style="position:absolute;left:' + p.lx + 'px;top:' + p.ly + 'px">' + lampe(p.lw, null, -400).replace('fill="#d8cfc0"', 'fill="' + (p.lum > .5 ? '#ffe3a6' : '#d8cfc0') + '"') + '</div>';
    if (p.titre > 0) s += '<div style="position:absolute;left:' + (24 * p.u) + 'px;top:' + (p.h * .42) + 'px;font-weight:800;letter-spacing:-.04em;line-height:1.02;color:#f1e9dc;font-size:' + (62 * p.u) + 'px;opacity:' + p.titre + ';white-space:nowrap">' + TXT.l1 + '<br>' + TXT.l2 + '</div>';
    if (p.cta > 0) s += '<div style="position:absolute;left:' + (24 * p.u) + 'px;top:' + (p.h * .74) + 'px;font-family:Inter;font-weight:600;color:#1d2a24;background:#f1e9dc;border-radius:99px;padding:' + (14 * p.u) + 'px ' + (28 * p.u) + 'px;font-size:' + (24 * p.u) + 'px;opacity:' + p.cta + '">' + TXT.cta + '</div>';
    el.innerHTML = s;
  }
  // Les cases en couleurs : l'image de chaque plan à son milieu.
  var MILIEUX = [2.6, 6.5, 12.5];
  CASES.forEach(function (c, i) { var cc = c.querySelector('.couleur'); cc.style.background = '#1d2a24'; cc.style.position = 'absolute'; vignette(cc, MILIEUX[i]); cc.style.transform = 'scale(' + (272 / 252) + ')'; cc.style.transformOrigin = '0 0'; });

  // La pellicule : trois vignettes, chacune un plan.
  var VIGS = [];
  for (var i = 0; i < 3; i++) {
    var v = document.createElement('div'); v.className = 'vig'; v.style.left = (i * 274) + 'px'; vignette(v, MILIEUX[i]); $('pellicule').appendChild(v); VIGS.push(v);
    var lb = document.createElement('div'); lb.className = 'vlab'; lb.style.left = (i * 274) + 'px'; lb.textContent = TXT.c[i][0] + ' · ' + TXT.c[i][1]; $('pellicule').appendChild(lb);
  }

  var TITRES = [[0.3, 6.0], [6.6, 12.4], [13.0, 17.4]];
  function titres(t) {
    TITRES.forEach(function (p, i) {
      $('ta' + i).querySelectorAll('.ln').forEach(function (ln, q) {
        var e = A(seg(t, p[0] + q * 0.13, p[0] + q * 0.13 + 0.95));
        var s = S(seg(t, p[1] + q * 0.06, p[1] + q * 0.06 + 0.4));
        ln.style.transform = 'translateY(' + ((1 - e) * 140 - s * 140).toFixed(2) + '%)';
      });
    });
  }

  window.render = function (t) {
    titres(t);
    var boucle = S(seg(t, 17.4, 18)), bas = boucle * 60, fond = 1 - boucle;

    // La planche : elle entre, ses cases se dessinent, elle est validée ; elle sort par le bas
    // pendant le motion design, puis revient seule à l'acte 3.
    var pIn = A(seg(t, 0.4, 1.2)), pOut = S(seg(t, 6.3, 7.1)), pRet = A(seg(t, 12.9, 13.8));
    var py = 330 + (1 - pIn) * 60 + pOut * 900 - pRet * 900 * (pOut > 0 ? 1 : 0);
    pose(planche, 60, py + bas, (pIn * (1 - pOut) + pRet) * fond);
    CASES.forEach(function (c, i) {
      var k = A(seg(t, 0.9 + i * 0.3, 1.5 + i * 0.3));
      c.style.opacity = k;
      c.querySelectorAll('.trait > *').forEach(function (p, q) { if (!p.getAttribute('stroke-dasharray')) p.style.strokeDashoffset = String(1 - A(seg(t, 1.2 + i * 0.7 + q * 0.12, 1.9 + i * 0.7 + q * 0.12))); else p.style.opacity = seg(t, 1.6 + i * 0.7, 2.0 + i * 0.7); });
      // Les cases prennent leurs couleurs juste avant de partir en pellicule.
      c.querySelector('.couleur').style.opacity = A(seg(t, 5.4 + i * 0.15, 5.9 + i * 0.15)) * (1 - seg(t, 12.9, 13.0));
      c.querySelector('.trait').style.opacity = 1 - c.querySelector('.couleur').style.opacity;
      c.querySelectorAll('.num, .txt, .ecran').forEach(function (n, q) { n.style.opacity = A(seg(t, 1.6 + i * 0.7 + q * 0.12, 2.2 + i * 0.7 + q * 0.12)); });
    });
    var v = ressort(seg(t, 4.4, 5.0)) * (1 - seg(t, 12.9, 13.0));
    $('valide').style.opacity = Math.min(1, v * 2); $('valide').style.transform = 'scale(' + v.toFixed(3) + ')';
    var pd = ressort(seg(t, 14.4, 15.0));
    $('pdf').style.opacity = Math.min(1, pd * 2); $('pdf').style.transform = 'scale(' + pd.toFixed(3) + ')';

    // Le lecteur et la pellicule.
    var lIn = A(seg(t, 6.7, 7.5)), lOut = S(seg(t, 12.5, 13.1));
    pose($('lecteur'), 140, 296 - lOut * 900 + (1 - lIn) * 40, lIn);
    pose($('pellicule'), 140, 790 + (1 - lIn) * 120 + lOut * 400, lIn * (1 - lOut));
    VIGS.forEach(function (g, i) { g.style.opacity = A(seg(t, 6.9 + i * 0.15, 7.4 + i * 0.15)); });
    // La tête de lecture traverse les trois plans ; le lecteur joue le plan sous elle.
    var lect = seg(t, 7.5, 12.3), vt = lect * 15;
    $('tete').style.left = (lect * 800 - 2) + 'px';
    var p = plan(vt, 800);
    var L = $('vLampe');
    L.innerHTML = lampe(p.lw, null, -900).replace('fill="#d8cfc0"', 'fill="' + (p.lum > .5 ? '#ffe3a6' : '#d8cfc0') + '"');
    L.style.transformOrigin = (p.lw / 2) + 'px 0';
    L.style.transform = 'translate(' + p.lx + 'px,' + p.ly + 'px) rotate(' + p.bal.toFixed(2) + 'deg)';
    var hr = p.lw * 1.3;
    $('vHalo').style.width = $('vHalo').style.height = (2 * hr) + 'px';
    pose($('vHalo'), p.lx + p.lw / 2 - hr, p.ly + p.lw * 1.1 - hr, p.glow);
    pose($('vTitre'), 44, 200 + (1 - p.titre) * 24, p.titre);
    $('vl2').style.opacity = p.titre2;
    pose($('vCta'), 44, 352 + (1 - p.cta) * 16, p.cta);
    pose($('vLogo'), 44, 36, 0.9);
    $('vTemps').textContent = '0:' + String(Math.floor(vt)).padStart(2, '0') + ' / 0:15';
    pose($('vTemps'), 690, 410, 1);
  };

  window.PRET = Promise.all([document.fonts.load('800 40px "Plus Jakarta Sans"'), document.fonts.load('700 40px "Plus Jakarta Sans"'), document.fonts.load('600 20px "Inter"')]);
  window.render(0);
})();
</script>
<script src="/motion/lecteur.js"></script>
</body>
</html>
